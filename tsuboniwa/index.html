<title>水音の坪庭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* レイアウト: 画面いっぱいの3D庭。左上に縦書きの題、下端に視点と音量、初回だけ中央下に入口カード */
  :root{
    --sumi:#151a19;
    --sumi-glass:rgba(21,26,25,.62);
    --kinu:#eee9dc;
    --kinu-dim:#bcbbad;
    --koke:#93a96c;
    --line:rgba(238,233,220,.24);
    --font-disp:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
    --font-ui:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%}
  body{margin:0;background:var(--sumi);color:var(--kinu);font-family:var(--font-ui);font-size:14px;line-height:1.6;overflow:hidden}
  #stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--sumi)}
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
  #c.drag{cursor:grabbing}

  #title{position:absolute;top:16px;left:16px;margin:0;writing-mode:vertical-rl;font-family:var(--font-disp);font-weight:700;font-size:34px;letter-spacing:.32em;line-height:1;color:var(--kinu);text-shadow:0 0 3px rgba(10,14,13,.5),0 1px 16px rgba(10,14,13,.7);pointer-events:none}
  #title small{display:block;font-weight:500;font-size:12px;letter-spacing:.3em;margin-top:.9em;color:var(--kinu);opacity:.85}

  #bar{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px 16px;pointer-events:none;transition:opacity .8s ease}
  #bar[hidden]{display:none!important}
  #bar > *{pointer-events:auto}
  .group{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
  .chip{font:inherit;font-size:13px;letter-spacing:.12em;color:var(--kinu);background:var(--sumi-glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);padding:8px 14px;border-radius:2px;cursor:pointer}
  .chip:hover{border-color:var(--kinu)}
  .chip[aria-pressed="true"]{background:var(--kinu);color:var(--sumi);border-color:var(--kinu)}
  .chip:focus-visible,#vol:focus-visible,#enter:focus-visible{outline:2px solid var(--koke);outline-offset:2px}
  #sound{align-items:center}
  #vol{width:110px;accent-color:var(--kinu)}
  #sound label{font-size:12px;letter-spacing:.2em;color:var(--kinu);text-shadow:0 1px 10px rgba(10,14,13,.6)}

  #intro{position:absolute;left:50%;bottom:calc(9% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(430px,calc(100% - 32px));box-sizing:border-box;padding:22px 24px 24px;background:var(--sumi-glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:2px;transition:opacity .9s ease,transform .9s ease}
  #intro.gone{opacity:0;transform:translate(-50%,10px);pointer-events:none}
  #intro h1{margin:0 0 10px;font-family:var(--font-disp);font-weight:700;font-size:26px;letter-spacing:.24em}
  #intro p{margin:0 0 18px;color:var(--kinu-dim);max-width:34em}
  #enter{font:inherit;font-weight:500;letter-spacing:.24em;color:var(--sumi);background:var(--kinu);border:0;padding:11px 26px;border-radius:2px;cursor:pointer}
  #enter:hover{background:#fff}

  #nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--kinu-dim)}
  @media (max-width:520px){
    #title{font-size:24px}
    #vol{width:84px}
  }
</style>

<div id="stage">
  <canvas id="c" tabindex="0" aria-label="坪庭の3D表示。ドラッグで見回せます。"></canvas>
  <h2 id="title">坪庭</h2>
  <div id="nogl">この環境では WebGL が使えないため、庭を表示できません。</div>

  <div id="bar" hidden>
    <div class="group" id="views" role="group" aria-label="視点">
      <button class="chip" type="button" data-view="engawa" aria-pressed="true">縁側</button>
      <button class="chip" type="button" data-view="tobi" aria-pressed="false">飛び石</button>
      <button class="chip" type="button" data-view="shishi" aria-pressed="false">鹿威し</button>
      <button class="chip" type="button" data-view="sky" aria-pressed="false">見上げる</button>
    </div>
    <div class="group" id="sound">
      <label for="vol">音量</label>
      <input id="vol" type="range" min="0" max="100" value="70">
      <button class="chip" type="button" id="mute" aria-pressed="false">消音</button>
    </div>
  </div>

  <div id="intro">
    <h1>水音の坪庭</h1>
    <p>聞こえるのは、水の流れと鹿威しの音だけです。端末の音量を少し上げてください。ドラッグで見回せます。</p>
    <button id="enter" type="button">庭に入る</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const T = THREE;
const $ = s => document.querySelector(s);

/* ================= 共通ユーティリティ ================= */
let seed = 20260929;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const C = h => new T.Color(h).convertSRGBToLinear();
const hash2 = (x, y) => { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}
const fbm = (x, y) => vnoise(x, y) * 0.5 + vnoise(x * 2.1, y * 2.1) * 0.25 + vnoise(x * 4.3, y * 4.3) * 0.125;

/* ================= レンダラー ================= */
const canvas = $('#c');
let renderer;
try{
  renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
}catch(e){
  $('#nogl').style.display = 'flex';
  $('#intro').style.display = 'none';
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;

const scene = new T.Scene();
scene.fog = new T.FogExp2(C('#c9d6d0'), 0.05);
const camera = new T.PerspectiveCamera(62, 1, 0.05, 150);
const timeU = { value: 0 };

const SUN_DIR = new T.Vector3(0.2, 6.5, 3.0).normalize();
const hemi = new T.HemisphereLight(C('#b9d0e6'), C('#8b7c5e'), 0.8);
scene.add(hemi);
const sun = new T.DirectionalLight(C('#fff0d4'), 2.25);
sun.position.copy(SUN_DIR).multiplyScalar(16);
sun.target.position.set(0, 0, -0.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 2, far: 34 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);

/* ================= テクスチャ ================= */
function tex(w, h, draw, srgb){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new T.CanvasTexture(c);
  if(srgb !== false) t.encoding = T.sRGBEncoding;
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
function dots(g, w, h, n, cols, r0, r1, a){
  for(let i = 0; i < n; i++){
    g.globalAlpha = a * (0.5 + rnd() * 0.5);
    g.fillStyle = cols[(rnd() * cols.length) | 0];
    g.beginPath(); g.arc(rnd() * w, rnd() * h, rr(r0, r1), 0, 6.2832); g.fill();
  }
  g.globalAlpha = 1;
}

/* 砂利 (庭全体に1枚。ワールド座標 x:-2.6..2.6, z:-2.8..2.0 に対応) */
const GW = 1300, GH = 1200, PPM = 250;
const gPx = x => (x + 2.6) * PPM, gPy = z => (z + 2.8) * PPM;
const ISLETS = [[0.95, 0.45, 0.3], [1.9, 1.15, 0.22]];
const gravelTex = tex(GW, GH, (g, w, h) => {
  g.fillStyle = '#9d988c'; g.fillRect(0, 0, w, h);
  for(let i = 0; i < 260; i++){
    g.globalAlpha = 0.1; g.fillStyle = rnd() < 0.5 ? '#b9b3a6' : '#e4e0d6';
    g.beginPath(); g.arc(rnd() * w, rnd() * h, rr(14, 60), 0, 6.283); g.fill();
  }
  g.globalAlpha = 1;
  dots(g, w, h, 30000, ['#8f8a7e', '#d8d4ca', '#75716a', '#aaa494', '#c3bba7', '#9c968a'], 0.8, 2.6, 0.75);
  // 砂紋: 別キャンバスに描いて、飛び石の周りは円形にくり抜く
  const rk = document.createElement('canvas'); rk.width = w; rk.height = h;
  const rg = rk.getContext('2d');
  const x0 = gPx(-0.3), x1 = gPx(2.58);
  const wave = (z, off) => {
    rg.beginPath();
    for(let px = x0; px <= x1; px += 8){
      const y = gPy(z) + off + Math.sin(px * 0.02 + z * 9) * 2.2;
      if(px === x0) rg.moveTo(px, y); else rg.lineTo(px, y);
    }
    rg.stroke();
  };
  for(let z = -0.3; z < 1.98; z += 0.055){
    rg.strokeStyle = 'rgba(70,64,54,0.34)'; rg.lineWidth = 2.6; wave(z, 0);
    rg.strokeStyle = 'rgba(255,255,248,0.42)'; rg.lineWidth = 1.7; wave(z, 3.2);
  }
  rg.globalCompositeOperation = 'destination-out';
  ISLETS.forEach(([x, z, r]) => { rg.beginPath(); rg.arc(gPx(x), gPy(z), (r + 0.5) * PPM, 0, 6.283); rg.fill(); });
  rg.globalCompositeOperation = 'source-over';
  g.drawImage(rk, 0, 0);
  // 島の周りの同心円
  ISLETS.forEach(([x, z, r]) => {
    for(let k = 0; k < 6; k++){
      const rad = (r + 0.06 + k * 0.075) * PPM;
      g.strokeStyle = 'rgba(70,64,54,0.34)'; g.lineWidth = 2.6;
      g.beginPath(); g.arc(gPx(x), gPy(z), rad, 0, 6.283); g.stroke();
      g.strokeStyle = 'rgba(255,255,248,0.42)'; g.lineWidth = 1.7;
      g.beginPath(); g.arc(gPx(x), gPy(z), rad + 3.2, 0, 6.283); g.stroke();
    }
  });
});
gravelTex.wrapS = gravelTex.wrapT = T.ClampToEdgeWrapping;

const plasterTex = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#e6e0d1'; g.fillRect(0, 0, w, h);
  for(let i = 0; i < 90; i++){
    g.globalAlpha = 0.07; g.fillStyle = rnd() < 0.5 ? '#c9c0ac' : '#f4f0e6';
    g.beginPath(); g.arc(rnd() * w, rnd() * h, rr(20, 90), 0, 6.283); g.fill();
  }
  g.globalAlpha = 1;
  dots(g, w, h, 5000, ['#b8ae98', '#f7f4ec', '#a79d88'], 0.6, 1.8, 0.35);
});
const yakiTex = tex(256, 512, (g, w, h) => {
  g.fillStyle = '#1f1b18'; g.fillRect(0, 0, w, h);
  for(let b = 0; b < 8; b++){
    const x = b * 32;
    g.fillStyle = `rgba(${40 + rnd() * 20},${34 + rnd() * 14},${30 + rnd() * 10},0.55)`; g.fillRect(x + 2, 0, 28, h);
    for(let i = 0; i < 26; i++){
      g.strokeStyle = `rgba(${70 + rnd() * 40},${62 + rnd() * 30},${54 + rnd() * 20},${0.12 + rnd() * 0.25})`;
      g.lineWidth = rr(0.6, 1.6); const gx = x + rr(3, 29);
      g.beginPath(); g.moveTo(gx, 0); g.lineTo(gx + rr(-2, 2), h); g.stroke();
    }
    g.fillStyle = '#0d0b0a'; g.fillRect(x, 0, 2, h);
  }
});
const woodTex = tex(128, 256, (g, w, h) => {
  g.fillStyle = '#8b6440'; g.fillRect(0, 0, w, h);
  for(let i = 0; i < 70; i++){
    g.strokeStyle = `rgba(${50 + rnd() * 40},${30 + rnd() * 25},${15 + rnd() * 15},${0.1 + rnd() * 0.3})`;
    g.lineWidth = rr(0.6, 2.4); const x = rnd() * w;
    g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + rr(-6, 6), h * 0.3, x + rr(-6, 6), h * 0.7, x + rr(-3, 3), h); g.stroke();
  }
});
const floorTex = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#a97f52'; g.fillRect(0, 0, w, h);
  const rows = 8, rh = h / rows;
  for(let r = 0; r < rows; r++){
    g.fillStyle = `rgba(${rnd() * 40},${rnd() * 25},0,${0.10 + rnd() * 0.1})`; g.fillRect(0, r * rh, w, rh);
    for(let i = 0; i < 26; i++){
      g.strokeStyle = `rgba(${70 + rnd() * 30},${44 + rnd() * 20},${20 + rnd() * 12},${0.12 + rnd() * 0.28})`;
      g.lineWidth = rr(0.6, 1.8); const y = r * rh + rr(3, rh - 3);
      g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * 0.3, y + rr(-2, 2), w * 0.7, y + rr(-2, 2), w, y); g.stroke();
    }
    g.fillStyle = '#4a3220'; g.fillRect(0, r * rh, w, 2.5);
  }
});
const shojiTex = tex(256, 512, (g, w, h) => {
  g.fillStyle = '#f2e9d2'; g.fillRect(0, 0, w, h);
  dots(g, w, h, 1800, ['#e4d8b8', '#fbf5e4'], 0.5, 1.6, 0.4);
  g.fillStyle = '#4b3625';
  const bar = 6;
  g.fillRect(0, 0, bar * 1.6, h); g.fillRect(w - bar * 1.6, 0, bar * 1.6, h);
  g.fillRect(0, 0, w, bar * 1.6); g.fillRect(0, h - bar * 1.6, w, bar * 1.6);
  for(let i = 1; i < 4; i++) g.fillRect(i * w / 4 - 2, 0, 4, h);
  for(let j = 1; j < 10; j++) g.fillRect(0, j * h / 10 - 2, w, 4);
});
const tileTex = tex(256, 128, (g, w, h) => {
  g.fillStyle = '#3a4043'; g.fillRect(0, 0, w, h);
  for(let x = 0; x < w; x += 16){
    const gr = g.createLinearGradient(x, 0, x + 16, 0);
    gr.addColorStop(0, '#22282a'); gr.addColorStop(0.5, '#565e61'); gr.addColorStop(1, '#22282a');
    g.fillStyle = gr; g.fillRect(x, 0, 16, h);
  }
});
const barkTex = tex(128, 256, (g, w, h) => {
  g.fillStyle = '#6b5f52'; g.fillRect(0, 0, w, h);
  for(let i = 0; i < 90; i++){
    g.strokeStyle = `rgba(${30 + rnd() * 40},${26 + rnd() * 30},${22 + rnd() * 20},${0.15 + rnd() * 0.3})`;
    g.lineWidth = rr(0.6, 2.2); const x = rnd() * w;
    g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + rr(-5, 5), h * 0.3, x + rr(-5, 5), h * 0.7, x + rr(-3, 3), h); g.stroke();
  }
  dots(g, w, h, 500, ['#9a9a86', '#4b463c'], 0.8, 2.2, 0.3);
});
const bambooTex = tex(64, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, w, 0);
  gr.addColorStop(0, '#5a8440'); gr.addColorStop(0.35, '#86b25a'); gr.addColorStop(1, '#55803c');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for(let i = 0; i < 18; i++){
    g.strokeStyle = `rgba(230,240,190,${0.05 + rnd() * 0.12})`; g.lineWidth = 1; const x = rnd() * w;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke();
  }
  g.fillStyle = '#b6bf84'; g.fillRect(0, 0, w, 16);
  g.fillStyle = '#3f5f2c'; g.fillRect(0, 10, w, 3);
});
const rockTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#8b8d88'; g.fillRect(0, 0, w, h);
  for(let i = 0; i < 70; i++){
    g.globalAlpha = 0.16; g.fillStyle = ['#6d6f6b', '#a9a89f', '#867a68', '#75827a'][(rnd() * 4) | 0];
    g.beginPath(); g.arc(rnd() * w, rnd() * h, rr(8, 40), 0, 6.283); g.fill();
  }
  g.globalAlpha = 1;
  dots(g, w, h, 4500, ['#5c5e5a', '#cfcdc2', '#3f4240', '#b4b0a0'], 0.6, 1.8, 0.5);
});
const dotSprite = tex(64, 64, (g, w, h) => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,244,214,1)'); gr.addColorStop(0.35, 'rgba(255,236,190,0.45)'); gr.addColorStop(1, 'rgba(255,230,180,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});

/* ================= マテリアル ================= */
const std = (o) => new T.MeshStandardMaterial(o);
const M = {
  plaster: std({ map: plasterTex, color: C('#d8d2c2'), roughness: 1 }),
  yaki: std({ map: yakiTex, roughness: 0.85 }),
  wood: std({ map: woodTex, roughness: 0.8 }),
  dwood: std({ map: woodTex, color: C('#6a5443'), roughness: 0.85 }),
  floor: std({ map: floorTex, roughness: 0.7 }),
  ceil: std({ map: floorTex, color: C('#7a624d'), roughness: 0.9 }),
  tile: std({ map: tileTex, roughness: 0.6 }),
  shoji: std({ map: shojiTex, roughness: 0.95, emissive: C('#ffe2a8'), emissiveMap: shojiTex, emissiveIntensity: 0.32 }),
  bark: std({ map: barkTex, roughness: 1, side: T.DoubleSide }),
  bamboo: std({ map: bambooTex, roughness: 0.5 }),
  moss: std({ roughness: 1, color: 0xffffff }),
  dark: std({ color: C('#2a231e'), roughness: 1 }),
  rock: [
    std({ map: rockTex, color: C('#ffffff'), roughness: 0.95 }),
    std({ map: rockTex, color: C('#e8e2d4'), roughness: 0.95 }),
    std({ map: rockTex, color: C('#cfd5d2'), roughness: 0.95 }),
    std({ map: rockTex, color: C('#cdbfae'), roughness: 0.95 })
  ]
};
const addMesh = (geo, mat, x, y, z, o = {}) => {
  const m = new T.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = o.cast !== false; m.receiveShadow = o.recv !== false;
  if(o.ry) m.rotation.y = o.ry;
  (o.parent || scene).add(m); return m;
};
function fixBoxUV(g, w, h, d, s){
  const uv = g.attributes.uv;
  for(let f = 0; f < 6; f++){
    const a = f < 2 ? d : w, b = f < 2 ? h : (f < 4 ? d : h);
    for(let k = 0; k < 4; k++){ const i = f * 4 + k; uv.setXY(i, uv.getX(i) * a * s, uv.getY(i) * b * s); }
  }
}
function box(w, h, d, mat, x, y, z, o = {}){
  const g = new T.BoxGeometry(w, h, d); fixBoxUV(g, w, h, d, o.uv || 1);
  return addMesh(g, mat, x, y, z, o);
}

/* ================= 地形 (流れと池を彫り込んだ地面) ================= */
const STREAM = new T.CatmullRomCurve3([
  [0.5, -1.9], [0.05, -1.72], [-0.5, -1.38], [-0.95, -0.88], [-1.28, -0.25], [-1.85, 0.28], [-2.4, 0.42], [-3.0, 0.45]
].map(p => new T.Vector3(p[0], 0, p[1])));
const NS = 180;
const SP = STREAM.getSpacedPoints(NS);
const SPX = SP.map(p => p.x), SPZ = SP.map(p => p.z);
const SPT = SP.map((p, i) => STREAM.getTangentAt(i / NS));
const PC = [1.05, -1.9];           // 池の中心
const WL = -0.045;                 // 水面の高さ
function streamDist(x, z){
  let m = 1e9;
  for(let i = 0; i <= NS; i++){ const dx = x - SPX[i], dz = z - SPZ[i], d = dx * dx + dz * dz; if(d < m) m = d; }
  return Math.sqrt(m);
}
function heightFrom(x, z, d){
  const bw = 0.17 + 0.03 * Math.sin(x * 3.1 + z * 2.3);
  let y = -0.11 * (1 - smooth(bw, 0.52, d));
  const px = x - PC[0], pz = z - PC[1], pd = Math.hypot(px, pz), a = Math.atan2(pz, px);
  const R = 0.5 + 0.05 * Math.sin(3 * a + 1) + 0.03 * Math.sin(5 * a + 2);
  y = Math.min(y, -0.17 * (1 - smooth(0.55 * R, 1.18 * R, pd)));

  fragmentShader: `
    uniform float uTime; uniform vec4 uRip[6]; uniform vec3 uSunDir, uDeep, uShallow, uSkyTop, uSkyHor;
    varying vec3 vW; varying vec2 vFlow; varying float vEdge;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);

    const e = map.get(key) || { x: 0, y: 0, z: 0, ids: [] };
    e.x += n.getX(i); e.y += n.getY(i); e.z += n.getZ(i); e.ids.push(i); map.set(key, e);

function taperedTube(curve, segs, radial, r0, r1, vScale){
  const fr = curve.computeFrenetFrames(segs, false), len = curve.getLength();
  const pos = [], nor = [], uv = [], idx = [];
  for(let i = 0; i <= segs; i++){
    const t = i / segs, p = curve.getPointAt(t), N = fr.normals[i], B = fr.binormals[i], r = lerp(r0, r1, Math.pow(t, 0.9));
    for(let j = 0; j <= radial; j++){
      const a = j / radial * 6.2832, cx = Math.cos(a), sx = Math.sin(a);
      const nx = cx * N.x + sx * B.x, ny = cx * N.y + sx * B.y, nz = cx * N.z + sx * B.z;
      pos.push(p.x + r * nx, p.y + r * ny, p.z + r * nz); nor.push(nx, ny, nz); uv.push(j / radial, t * len / vScale);
    }
  }
  for(let i = 0; i < segs; i++) for(let j = 0; j < radial; j++){
    const a = i * (radial + 1) + j, b = a + radial + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new T.Float32BufferAttribute(nor, 3)); g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
  return g;
}
function swayMat(mat){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = timeU;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
      float ph = instanceMatrix[3][0] * 2.1 + instanceMatrix[3][1] * 1.7 + instanceMatrix[3][2] * 1.3;
      transformed.x += sin(uTime * 2.1 + ph) * 0.018; transformed.z += cos(uTime * 1.7 + ph * 1.3) * 0.018; transformed.y += sin(uTime * 2.6 + ph) * 0.008;
      #endif`);
  };
  return mat;
}
function mapleLeafGeo(){
  const s = new T.Shape(), n = 64;
  for(let i = 0; i <= n; i++){
    const a = i / n * 6.2832, ap = a - Math.PI / 2;
    const r = 0.062 * (0.4 + 0.6 * Math.pow(Math.abs(Math.cos(2.5 * ap)), 1.6)) * (1 + 0.07 * Math.sin(a * 25));
    const x = Math.cos(a) * r, y = Math.sin(a) * r; if(i === 0) s.moveTo(x, y); else s.lineTo(x, y);
  }
  return new T.ShapeGeometry(s);
}
const mapleGeo = mapleLeafGeo();
const mapleMat = swayMat(std({ color: 0xffffff, roughness: 0.75, side: T.DoubleSide, emissive: C('#2e1206'), emissiveIntensity: 0.4 }));
function mapleColor(){
  const r = rnd(), c = new T.Color();
  if(r < 0.42) c.setHSL(0.012 + rnd() * 0.02, 0.78, 0.36 + rnd() * 0.1);
  else if(r < 0.72) c.setHSL(0.07 + rnd() * 0.03, 0.85, 0.45 + rnd() * 0.08);
  else if(r < 0.86) c.setHSL(0.14 + rnd() * 0.03, 0.7, 0.42);
  else c.setHSL(0.22 + rnd() * 0.05, 0.5, 0.32);
  return c.convertSRGBToLinear();
}
function leavesMesh(geo, mat, list, shadow){
  const im = new T.InstancedMesh(geo, mat, list.length), m = new T.Matrix4();
  list.forEach((L, i) => { m.compose(L.p, L.q, new T.Vector3(L.s, L.s, L.s)); im.setMatrixAt(i, m); im.setColorAt(i, L.c); });
  im.castShadow = shadow !== false; im.receiveShadow = true; scene.add(im); return im;
}

(function maple(){
  const P = (x, y, z) => new T.Vector3(x, y, z);
  const trunk = new T.CatmullRomCurve3([P(-1.92, -0.05, -1.58), P(-1.9, 0.5, -1.52), P(-1.8, 1.1, -1.44), P(-1.62, 1.75, -1.34), P(-1.42, 2.4, -1.28)]);
  addMesh(taperedTube(trunk, 24, 8, 0.09, 0.035, 0.4), M.bark, 0, 0, 0);
  const leaves = [];
  const cluster = (c, n, rad) => {
    for(let i = 0; i < n; i++){
      const p = P(c.x + rr(-1, 1) * rad, c.y + rr(-0.7, 0.7) * rad, c.z + rr(-1, 1) * rad);
      if(p.y < 3.55){ p.x = Math.max(p.x, -1.95); p.z = Math.max(p.z, -2.15); }
      const q = new T.Quaternion().setFromEuler(new T.Euler(-Math.PI / 2 + rr(-0.9, 0.9), rnd() * 6.28, rnd() * 6.28, 'YXZ'));
      leaves.push({ p, q, s: rr(0.8, 1.4), c: mapleColor() });
    }
  };
  const branch = (start, dir, len, depth, r0) => {
    const p1 = start.clone().addScaledVector(dir, len * 0.4).add(P(rr(-0.05, 0.05), len * 0.05, rr(-0.05, 0.05)));
    const d2 = dir.clone().add(P(rr(-0.3, 0.3), rr(-0.1, 0.25), rr(-0.3, 0.3))).normalize();
    const p2 = p1.clone().addScaledVector(d2, len * 0.35);
    const d3 = d2.clone().add(P(rr(-0.3, 0.3), rr(0, 0.3), rr(-0.3, 0.3))).normalize();
    const p3 = p2.clone().addScaledVector(d3, len * 0.3);
    const cv = new T.CatmullRomCurve3([start, p1, p2, p3]);
    addMesh(taperedTube(cv, 10, 6, r0, r0 * 0.35, 0.4), M.bark, 0, 0, 0);
    cluster(p2, depth === 0 ? 26 : 34, 0.34); cluster(p3, 46, 0.42);
    if(depth === 0){ for(let k = 0; k < 3; k++){
      const s = k === 0 ? p1 : (k === 1 ? p2 : p3);
      const dd = d3.clone().add(P(rr(-0.7, 0.7), rr(0.05, 0.5), rr(-0.7, 0.7))).normalize();
      branch(s.clone(), dd, len * 0.6, 1, r0 * 0.45);
    } }
  };
  for(let i = 0; i < 7; i++){
    const t = 0.42 + i * 0.085, s = trunk.getPointAt(Math.min(t, 1));
    const a = rr(-0.5, 2.1), up = rr(0.45, 0.95);
    branch(s, P(Math.cos(a) * (1 - up * 0.5), up, Math.sin(a) * (1 - up * 0.5)).normalize(), rr(0.9, 1.35), 0, 0.038);
  }
  cluster(P(-1.4, 2.5, -1.3), 60, 0.5);
  leavesMesh(mapleGeo, mapleMat, leaves);
})();

const NP = 90, parts = [];
const partMesh = new T.InstancedMesh(new T.SphereGeometry(1, 6, 4), std({ color: C('#e6f4f8'), transparent: true, opacity: 0.8, roughness: 0.1, emissive: C('#324046') }), NP);
partMesh.frustumCulled = false; scene.add(partMesh);
for(let i = 0; i < NP; i++) parts.push({ on: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 });

// 鹿威しの動き
const S = { th: 0.42, om: 0, f: 0, phase: 'fill', fillT: 4.2, rest: 0.42, min: -0.72, emit: 0, lastRip: 0, lastSplash: 0 };
function stepShishi(dt){
  if(S.phase === 'fill'){
    S.f = Math.min(1, S.f + dt / S.fillT);
    S.th = S.rest - 0.05 * smooth(0.75, 1.0, S.f);
    if(S.f >= 1){ S.phase = 'tip'; S.om = 0; Sound.pour(); }
  } else if(S.phase === 'tip'){
    S.om += -9 * dt; S.om *= (1 - 1.2 * dt); S.th += S.om * dt;
    if(S.th < 0.2) S.f = Math.max(0, S.f - dt * 1.6);
    if(S.th <= S.min){ S.th = S.min; S.om = -S.om * 0.25; }
    if(S.f < 0.2) S.phase = 'return';
  } else {
    S.om += 13 * dt; S.om *= (1 - 0.6 * dt); S.th += S.om * dt;
    if(S.th < 0.2) S.f = Math.max(0, S.f - dt * 2.2);
    if(S.th <= S.min){ S.th = S.min; S.om = Math.max(S.om, 0); }
    if(S.th >= S.rest){
      S.th = S.rest; Sound.kon(clamp(S.om / 5, 0.15, 1)); S.om = -S.om * 0.28;
      if(-S.om < 0.6){ S.om = 0; S.phase = 'fill'; S.f = 0; S.fillT = rr(8.5, 11.5); }
    }
  }
  Sound.fill(S.f, S.phase === 'fill');
  arm.rotation.z = S.th;
  const f = Math.max(0.001, S.f);
  waterFill.scale.set(f, 1, 1); waterFill.position.x = -0.15 + 0.225 * f;
  // 口から落ちる水
  if((S.phase !== 'fill') && S.th < 0.15 && S.f > 0.02){
    S.emit += dt * 170 * Math.min(1, S.f * 1.6);
    while(S.emit >= 1){
      S.emit -= 1;
      const p = parts.find(q => !q.on); if(!p) break;
      const c = Math.cos(S.th), s = Math.sin(S.th), sp = 0.4 + 0.9 * Math.max(0, 0.15 - S.th);
      p.on = true; p.x = SH.x - 0.31 * c + rr(-0.005, 0.005); p.y = SH.y + 0.31 * s - 0.01; p.z = SH.z + rr(-0.03, 0.03);
      p.vx = -c * sp + rr(-0.05, 0.05); p.vy = s * sp + rr(-0.1, 0.05); p.vz = rr(-0.05, 0.05);
    }
  }
  const t = timeU.value;
  for(let i = 0; i < NP; i++){
    const p = parts[i]; if(!p.on) continue;
    p.vy -= 9.8 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    const gh = heightAt(p.x, p.z), lvl = Math.max(gh, WL);
    if(p.y <= lvl){
      p.on = false; partMesh.setMatrixAt(i, zeroM);
      if(gh < WL){
        if(t - S.lastRip > 0.08){ S.lastRip = t; addRipple(p.x, p.z, rr(0.7, 1.1)); }
        if(t - S.lastSplash > 0.07){ S.lastSplash = t; Sound.splash(); }
      }
    }
  }
  const m = new T.Matrix4();
  for(let i = 0; i < NP; i++){
    const p = parts[i]; if(!p.on) continue;
    const l = 1 + Math.min(Math.abs(p.vy) * 0.25, 1.6);
    m.compose(new T.Vector3(p.x, p.y, p.z), new T.Quaternion(), new T.Vector3(0.0095, 0.0095 * l, 0.0095)); partMesh.setMatrixAt(i, m);
  }
  partMesh.instanceMatrix.needsUpdate = true;
  // 細い流れ
  const mouthY = SH.y + 0.27 * Math.sin(S.th) + 0.036;
  const len = SUP.top - mouthY;
  thread.scale.set(0.0045, Math.max(len, 0.01), 0.0045);
  thread.position.set(SUP.x, mouthY + len / 2, SUP.z);
}

const FL = 16, leafFall = [], fallMesh = new T.InstancedMesh(mapleGeo, mapleMat, FL);
fallMesh.frustumCulled = false; fallMesh.castShadow = true; scene.add(fallMesh);
function resetLeaf(l, initial){
  l.x = rr(-2.0, -0.4); l.z = rr(-2.0, -0.8); l.y = initial ? rr(0.4, 3.6) : rr(3.3, 4.1);
  l.state = 0; l.ph = rnd() * 6.28; l.spin = rr(-1, 1); l.fall = rr(0.14, 0.26); l.life = 0; l.sc = rr(0.9, 1.3); l.rot = rnd() * 6.28;
  fallMesh.setColorAt(l.i, mapleColor());
  if(fallMesh.instanceColor) fallMesh.instanceColor.needsUpdate = true;
}
for(let i = 0; i < FL; i++){ const l = { i }; resetLeaf(l, true); leafFall.push(l); }
const dummy = new T.Object3D();
function updateLeaves(dt, t){
  leafFall.forEach(l => {
    let s = l.sc, rx = -Math.PI / 2, rz = l.rot;
    if(l.state === 0){
      l.y -= l.fall * dt; l.x += (Math.sin(t * 0.9 + l.ph) * 0.22 + 0.03) * dt; l.z += Math.cos(t * 0.7 + l.ph) * 0.14 * dt;
      rx += Math.sin(t * 1.6 + l.ph) * 0.7; rz = l.rot + t * l.spin * 0.6;
      l.x = clamp(l.x, -2.5, 2.5); l.z = clamp(l.z, -2.7, 1.9);
      const gh = heightAt(l.x, l.z);
      if(l.y <= Math.max(gh, WL) + 0.006){
        if(gh < WL){ l.state = 1; l.y = WL + 0.004; addRipple(l.x, l.z, 0.35); } else { l.state = 2; l.y = gh + 0.008; }
        l.life = 0; l.rot = rz;
      }
    } else if(l.state === 1){
      l.life += dt; l.y = WL + 0.004;
      let k = 0, m = 1e9; for(let i = 0; i <= NS; i += 2){ const d = (l.x - SPX[i]) ** 2 + (l.z - SPZ[i]) ** 2; if(d < m){ m = d; k = i; } }
      const inPond = Math.hypot(l.x - PC[0], l.z - PC[1]) < 0.62;
      const sp = inPond ? 0.03 : 0.11, tg = SPT[k];
      if(inPond){ l.x += -0.9 * sp * dt; l.z += 0.35 * sp * dt; } else { l.x += tg.x * sp * dt; l.z += tg.z * sp * dt; }
      l.rot += dt * 0.08 * l.spin; rz = l.rot;
      if(l.x < -2.5 || l.life > 55) s = Math.max(0, s * (1 - (l.life - 50) / 5));
      if(l.x < -2.5 || l.life > 55) resetLeaf(l, false);
    } else {
      l.life += dt; if(l.life > 14) s *= Math.max(0, 1 - (l.life - 14) / 3);
      if(l.life > 17) resetLeaf(l, false);
    }
    dummy.position.set(l.x, l.y, l.z); dummy.rotation.set(rx, 0, rz, 'XYZ'); dummy.scale.setScalar(s); dummy.updateMatrix();
    fallMesh.setMatrixAt(l.i, dummy.matrix);
  });
  fallMesh.instanceMatrix.needsUpdate = true;
}

(function sky(){
  const m = new T.ShaderMaterial({
    side: T.BackSide, depthWrite: false, fog: false,
    uniforms: { uTime: timeU, uSunDir: { value: SUN_DIR }, uTop: { value: C('#7ea6cb') }, uMid: { value: C('#b4cfdf') }, uHor: { value: C('#ebeee2') }, uSun: { value: C('#fff1d0') } },
    vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform float uTime; uniform vec3 uSunDir, uTop, uMid, uHor, uSun; varying vec3 vD;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y); }
      float fbm(vec2 p){ return vn(p) * 0.5 + vn(p * 2.03) * 0.25 + vn(p * 4.1) * 0.125; }
      void main(){
        vec3 d = normalize(vD); float y = max(d.y, 0.0);
        vec3 col = mix(uHor, uMid, smoothstep(0.0, 0.35, y)); col = mix(col, uTop, smoothstep(0.3, 0.95, y));
        vec2 cp = d.xz / (d.y + 0.3) * 0.9 + vec2(uTime * 0.006, uTime * 0.002);
        float c = smoothstep(0.5, 0.88, fbm(cp * 1.7)) * smoothstep(0.03, 0.3, d.y);
        col = mix(col, vec3(1.0), c * 0.6);
        float s = max(dot(d, normalize(uSunDir)), 0.0); col += uSun * (pow(s, 220.0) * 1.3 + pow(s, 8.0) * 0.12);
        gl_FragColor = vec4(col, 1.0);
        #include <encodings_fragment>
      }`
  });
  scene.add(new T.Mesh(new T.SphereGeometry(80, 32, 16), m));
})();

/* ================= 音 (WebAudio で合成。水の流れと鹿威しのみ) ================= */
const Sound = (function(){
  let ctx = null, master, revIn, noiseBuf, loopStart = 0, vol = 0.7, muted = false, analyser = null;
  const streams = []; let fillOn = false, fillF = 0, plipNext = 0, supplyGain = null;
  let konV, pourV, splashV, mouthV;
  const rand = (a, b) => a + Math.random() * (b - a);
  const setPos = (p, x, y, z) => { if(p.positionX){ p.positionX.value = x; p.positionY.value = y; p.positionZ.value = z; } else p.setPosition(x, y, z); };
  const gain = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
  const biq = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if(q != null) b.Q.value = q; return b; };
  function makeNoise(){
    const len = ctx.sampleRate * 5, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for(let i = 0; i < len; i++){
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
      b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
    }
    const fade = Math.floor(ctx.sampleRate * 0.15);
    for(let i = 0; i < fade; i++){ const k = i / fade; d[len - fade + i] = d[len - fade + i] * (1 - k) + d[i] * k; }
    loopStart = fade / ctx.sampleRate; return buf;
  }
  function noiseSrc(){
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.loopStart = loopStart; s.loopEnd = noiseBuf.duration;
    s.start(0, loopStart + Math.random() * (noiseBuf.duration - loopStart - 0.2)); return s;
  }
  function makeIR(sec){
    const n = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, n, ctx.sampleRate), pre = Math.floor(ctx.sampleRate * 0.012);
    for(let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch); let lp = 0;
      for(let i = 0; i < n; i++){
        const t = i / n; lp += ((Math.random() * 2 - 1) - lp) * (0.5 * (1 - t) + 0.06);
        d[i] = i < pre ? 0 : lp * Math.pow(1 - t, 3.2) * 1.8;
      }
    }
    return buf;
  }
  function voice(x, y, z, rev, ref){
    const inp = ctx.createGain(), p = ctx.createPanner();
    p.panningModel = 'HRTF'; p.distanceModel = 'inverse'; p.refDistance = ref || 1.5; p.rolloffFactor = 0.8; p.maxDistance = 60; setPos(p, x, y, z);
    inp.connect(p); p.connect(master);
    const rs = gain(rev); p.connect(rs); rs.connect(revIn); return inp;
  }
  function bubble(out, t, a){
    const o = ctx.createOscillator(), g = ctx.createGain(), f0 = 380 + Math.pow(Math.random(), 1.8) * 2600;
    o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * rand(1.5, 2.5), t + rand(0.05, 0.09));
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(rand(0.008, 0.03) * a, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + rand(0.07, 0.15));
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.2);
  }
  function burst(out, t, f, q, dur, a){
    const s = noiseSrc(), b = biq('bandpass', f, q), g = gain(0.0001);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(a, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(b); b.connect(g); g.connect(out); s.stop(t + dur + 0.05);
  }
  function buildStreams(){
    [{ p: [0.45, 0.1, -1.85], a: 1.0, rate: 20 }, { p: [-0.65, 0.1, -1.05], a: 0.9, rate: 16, rumble: true }, { p: [-1.7, 0.1, 0.25], a: 0.8, rate: 14 }].forEach(d => {
      const out = voice(d.p[0], d.p[1], d.p[2], 0.2, 1.4), layers = [];
      const L = (type, f, q, base) => {
        const s = noiseSrc(), flt = biq(type, f, q), g = gain(base * d.a); s.connect(flt); flt.connect(g); g.connect(out);
        layers.push({ flt, g, base: base * d.a, f });
      };
      L('bandpass', 620, 0.8, 0.9); L('bandpass', 1800, 1.0, 0.55); L('highpass', 5200, 0.5, 0.07);
      if(d.rumble) L('lowpass', 240, 0.7, 0.55);
      streams.push({ out, layers, rate: d.rate, next: 0 });
    });
    // 筧から落ちる細い水
    const so = voice(1.48, 0.9, -2.0, 0.25, 1.0);
    const s1 = noiseSrc(), f1 = biq('bandpass', 3400, 2.2), g1 = gain(0.16); s1.connect(f1); f1.connect(g1); g1.connect(so);
    const s2 = noiseSrc(), f2 = biq('bandpass', 1400, 1.0), g2 = gain(0.09); s2.connect(f2); f2.connect(g2); g2.connect(so);
    supplyGain = so;
  }
  function modulate(){
    if(!ctx) return; const t = ctx.currentTime;
    streams.forEach(st => st.layers.forEach(l => {
      l.g.gain.setTargetAtTime(l.base * rand(0.65, 1.3), t, 0.12);
      if(l.flt.type === 'bandpass') l.flt.frequency.setTargetAtTime(l.f * rand(0.82, 1.22), t, 0.15);
    }));
  }
  function tick(){
    const now = ctx.currentTime, until = now + 0.35;
    streams.forEach(st => {
      if(st.next < now) st.next = now + Math.random() * 0.05;
      while(st.next < until){ bubble(st.out, st.next, 1); st.next += -Math.log(1 - Math.random()) / st.rate; }
    });
    if(fillOn){
      if(plipNext < now) plipNext = now;
      while(plipNext < until){
        const o = ctx.createOscillator(), g = ctx.createGain(), f0 = 650 + fillF * 2300;
        o.type = 'sine'; o.frequency.setValueAtTime(f0, plipNext); o.frequency.exponentialRampToValueAtTime(f0 * 1.35, plipNext + 0.05);
        g.gain.setValueAtTime(0.0001, plipNext); g.gain.linearRampToValueAtTime(0.05, plipNext + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, plipNext + 0.09);
        o.connect(g); g.connect(supplyGain); o.start(plipNext); o.stop(plipNext + 0.15);
        plipNext += rand(0.14, 0.34);
      }
    }
  }
  return {
    init(){
      if(ctx){ ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
      ctx = new AC();
      master = gain(vol * vol);
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 18; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.25;
      analyser = ctx.createAnalyser(); analyser.fftSize = 2048;
      master.connect(comp); comp.connect(ctx.destination); comp.connect(analyser);
      revIn = gain(1); const conv = ctx.createConvolver(); conv.buffer = makeIR(1.6); const rg = gain(0.55); revIn.connect(conv); conv.connect(rg); rg.connect(master);
      noiseBuf = makeNoise();
      buildStreams();
      konV = voice(1.97, 0.52, -2.0, 0.55, 2.4); pourV = voice(1.45, 0.45, -2.0, 0.3, 2.0); splashV = voice(1.2, 0.0, -1.9, 0.3, 2.0);
      setInterval(tick, 120); setInterval(modulate, 140);
      document.addEventListener('visibilitychange', () => { if(document.hidden) ctx.suspend(); else if(!muted) ctx.resume(); });
      window.__snd = { ctx, analyser };
    },
    ready(){ return !!ctx; },
    setVol(v){ vol = v; if(ctx) master.gain.setTargetAtTime(muted ? 0 : v * v, ctx.currentTime, 0.05); },
    setMuted(m){ muted = m; if(ctx) master.gain.setTargetAtTime(m ? 0 : vol * vol, ctx.currentTime, 0.08); },
    fill(f, on){ fillF = f; fillOn = on; },
    listen(cam){
      if(!ctx) return; const L = ctx.listener, p = cam.position, d = new T.Vector3(); cam.getWorldDirection(d);
      if(L.positionX){ L.positionX.value = p.x; L.positionY.value = p.y; L.positionZ.value = p.z; L.forwardX.value = d.x; L.forwardY.value = d.y; L.forwardZ.value = d.z; L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0; }
      else { L.setPosition(p.x, p.y, p.z); L.setOrientation(d.x, d.y, d.z, 0, 1, 0); }
    },
    kon(v){
      if(!ctx) return; const t = ctx.currentTime + 0.005, f0 = 780 * rand(0.97, 1.03);
      [[1, 1.0, 0.45], [2.02, 0.55, 0.25], [3.15, 0.32, 0.15], [4.6, 0.18, 0.09], [6.4, 0.09, 0.06]].forEach(([r, a, dec]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(f0 * r, t); o.frequency.exponentialRampToValueAtTime(f0 * r * 0.985, t + dec);
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(a * v * 2.0, t + 0.0015); g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
        o.connect(g); g.connect(konV); o.start(t); o.stop(t + dec + 0.05);
      });
      burst(konV, t, 3200, 0.8, 0.02, 3.5 * v);
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.08);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(1.4 * v, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      o.connect(g); g.connect(konV); o.start(t); o.stop(t + 0.15);
    },
    pour(){
      if(!ctx) return; const t = ctx.currentTime + 0.02;
      const s = noiseSrc(), b = biq('bandpass', 1000, 0.9), g = gain(0.0001);
      b.frequency.setValueAtTime(900, t); b.frequency.linearRampToValueAtTime(1900, t + 0.9);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(6, t + 0.12); g.gain.setValueAtTime(6, t + 0.45); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.05);
      s.connect(b); b.connect(g); g.connect(pourV); s.stop(t + 1.2);

      g2.gain.setValueAtTime(0.0001, t); g2.gain.linearRampToValueAtTime(3.5, t + 0.15); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
      s2.connect(b2); b2.connect(g2); g2.connect(pourV); s2.stop(t + 1.1);
    },
    splash(){
      if(!ctx) return; const t = ctx.currentTime + 0.01;
      burst(splashV, t, rand(1800, 3000), 1.2, 0.05, 5);

      o.connect(g); g.connect(splashV); o.start(t); o.stop(t + 0.15);
    }
  };
})();

const ptrs = new Map(); let pinch0 = 0, fov0 = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); canvas.classList.add('drag'); tween = null;
  if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); fov0 = cam.fov; }
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if(!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if(ptrs.size === 1){
    const k = 0.0036 * (cam.fov / 62);
    cam.yaw = clamp(cam.yaw + dx * k, -1.9, 1.9); cam.pitch = clamp(cam.pitch + dy * k, -0.6, 1.3); setPressed('');
  } else if(ptrs.size === 2){
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if(pinch0 > 0) cam.fov = clamp(fov0 * pinch0 / d, 30, 80);
  }
});
const endPtr = e => { ptrs.delete(e.pointerId); if(!ptrs.size) canvas.classList.remove('drag'); };
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);

const clock = new T.Clock(); const dir = new T.Vector3();

    tween.t += dt / tween.dur; const k = ease(clamp(tween.t, 0, 1)), a = tween.from, b = tween.to;

  }

  camera.position.set(cam.p.x, cam.p.y + Math.sin(t * 0.5) * 0.004 * sw, cam.p.z);
  dir.set(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));

  const fovNow = cam.fov * (camera.aspect < 1 ? Math.min(1.5, 1 / Math.pow(camera.aspect, 0.45)) : 1);
  if(Math.abs(camera.fov - fovNow) > 0.01){ camera.fov = fovNow; camera.updateProjectionMatrix(); }

}
