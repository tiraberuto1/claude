<title>酒呑童子 首の段</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --kon: #141923;
    --silk: #1d2431;
    --silk-2: #262f3f;
    --gold: #c6a35b;
    --gold-dim: #8c7442;
    --washi: #ebe3cf;
    --muted: #a3a7ae;
    --shu: #c0472f;
    --mincho: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --gothic: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  html, body { background: var(--kon); color: var(--washi); }
  body {
    font-family: var(--gothic);
    font-size: 15px;
    line-height: 1.75;
    padding-inline: 16px;
    padding-block: 28px 48px;
  }
  .wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; }
  .eyebrow { font-size: 12px; letter-spacing: .24em; color: var(--gold); margin: 0; }
  h1 {
    font-family: var(--mincho); font-weight: 700;
    font-size: clamp(28px, 4.2vw, 44px); line-height: 1.2; letter-spacing: .06em;
    margin: 4px 0 0; text-wrap: balance;
  }
  .lede { margin: 0; max-width: 34em; color: var(--muted); font-size: 14px; }

  /* 表装：一文字と中廻しを模した額縁 */
  .mount {
    background:
      repeating-linear-gradient(45deg, rgba(198,163,91,.07) 0 2px, transparent 2px 9px),
      var(--silk);
    border-top: 10px solid var(--gold-dim);
    border-bottom: 10px solid var(--gold-dim);
    box-shadow: inset 0 3px 0 rgba(0,0,0,.35), inset 0 -3px 0 rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.45);
    padding-block: 14px;
  }
  .scroller { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-color: var(--gold-dim) transparent; }
  .stage {
    position: relative;
    width: max(100%, 760px);
    aspect-ratio: 2000 / 893;
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage::after { /* 紙の端の焼け */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 60px rgba(60,35,10,.35);
  }
  .cover {
    position: absolute; top: -14px; bottom: -14px; left: 0; width: 0;
    background:
      repeating-linear-gradient(90deg, rgba(198,163,91,.10) 0 1px, transparent 1px 6px),
      var(--silk-2);
    pointer-events: none;
  }
  .cover::after { /* 巻いた軸 */
    content: ""; position: absolute; top: 0; bottom: 0; right: -18px; width: 36px;
    border-radius: 18px;
    background: linear-gradient(90deg, #6d5530, #d9c08a 38%, #f1e2b8 50%, #b89556 64%, #5a4424);
    box-shadow: 4px 0 12px rgba(0,0,0,.5);
  }
  .cover[hidden] { display: none !important; }
  .hint { display: none; margin: 8px 0 0; font-size: 12px; color: var(--muted); text-align: right; }
  @media (max-width: 800px) { .hint { display: block; } }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  button {
    font: 500 14px/1 var(--gothic); letter-spacing: .08em;
    color: var(--kon); background: var(--gold);
    border: 0; border-radius: 2px; padding: 11px 18px; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--washi); box-shadow: inset 0 0 0 1px var(--gold-dim); }
  button:hover { filter: brightness(1.08); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--washi); outline-offset: 3px; }
  label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
  input[type="range"] { accent-color: var(--gold); width: 140px; }
  input[type="checkbox"] { accent-color: var(--gold); width: 16px; height: 16px; }
  .spacer { flex: 1 1 0; }

  .parts {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px 28px; margin: 6px 0 0; padding: 18px 0 0;
    border-top: 1px solid rgba(198,163,91,.25);
  }
  .parts div { display: flex; flex-direction: column; gap: 2px; }
  .parts dt { font-family: var(--mincho); font-weight: 700; font-size: 16px; letter-spacing: .06em; }
  .parts dd { margin: 0; font-size: 13px; color: var(--muted); max-width: 30em; }
  .parts dt::before { content: ""; display: inline-block; width: 7px; height: 7px; background: var(--shu); margin-right: 9px; vertical-align: 3px; transform: rotate(45deg); }
</style>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">酒呑童子絵巻より・部分</p>
      <h1>酒呑童子 首の段</h1>
    </div>
    <p class="lede">頼光たちに斬り落とされた酒呑童子の首が、なお宙を飛んで頼光の兜に食らいつく場面です。原画の上に動きをつけ、首の揺れ、太刀のきらめき、血しぶき、流れる霞を加えています。</p>
  </header>

  <div class="mount">
    <div class="scroller" id="scroller">
      <div class="stage" id="stage">
        <canvas id="gl" width="2000" height="893" aria-label="動く酒呑童子絵巻の一場面"></canvas>
        <canvas id="fx" width="2000" height="893" aria-hidden="true"></canvas>
        <div class="cover" id="cover" hidden></div>
      </div>
    </div>
  </div>
  <p class="hint">絵巻は右から左へ。横にスクロールして全体をご覧ください。</p>

  <div class="controls">
    <button id="play" type="button">一時停止</button>
    <button id="unroll" class="ghost" type="button">絵巻を開き直す</button>
    <span class="spacer"></span>
    <label for="amp">動きの強さ <input id="amp" type="range" min="0" max="2" step="0.05" value="1"></label>
    <label for="blood"><input id="blood" type="checkbox" checked> 血しぶき</label>
    <label for="mist"><input id="mist" type="checkbox" checked> 霞</label>
  </div>

  <dl class="parts">
    <div><dt>飛ぶ首</dt><dd>斬られた首が兜めがけて何度も突きかかり、髪が風になびきます。</dd></div>
    <div><dt>頼光と四天王</dt><dd>振りかぶった太刀が揺れ、刃を光が走ります。</dd></div>
    <div><dt>首のない胴</dt><dd>首の切り口から血が噴き上がり、胴が小さく震えます。</dd></div>
    <div><dt>すやり霞</dt><dd>絵巻の場面を区切る霞が、画面の上下をゆっくり流れます。</dd></div>
  </dl>
</div>

  const FLUTTER = [
    [250, 205, 175, 5.5],
    [1530, 215, 115, 4.5],
    [1765, 250, 85, 2.5],
  ];
  function pulse(t) { return Math.pow(0.5 + 0.5 * Math.sin(t * 4.2), 2); }

  let amp = 1;
  const state = HANDLES.map(() => ({ tx: 0, ty: 0, rot: 0, sc: 0 }));
  function updateHandles(t) {
    HANDLES.forEach((h, i) => {
      const m = h.fn(t);
      state[i].tx = m.tx * amp; state[i].ty = m.ty * amp;
      state[i].rot = m.rot * amp; state[i].sc = m.sc * amp;
    });
  }
  // シェーダと同じ変位（出力座標 → 参照座標のずれ）
  function disp(x, y) {
    let dx = 0, dy = 0;
    for (let i = 0; i < HANDLES.length; i++) {
      const h = HANDLES[i], m = state[i];
      const vx = x - h.x, vy = y - h.y;
      const q = Math.hypot(vx, vy) / h.r;
      if (q >= 1) continue;
      let w = 1 - q * q; w *= w;
      const a = -m.rot * w, k = 1 + m.sc * w;
      const ux = (vx - m.tx * w) / k, uy = (vy - m.ty * w) / k;
      const c = Math.cos(a), s = Math.sin(a);
      dx += h.x + c * ux - s * uy - x;
      dy += h.y + s * ux + c * uy - y;
    }
    return [dx, dy];
  }
  // 原画上の点が、いま画面上のどこに見えているか
  function moved(x, y) { const [dx, dy] = disp(x, y); return [x - dx, y - dy]; }

  // ---- WebGL ----
  const img = new Image();
  let gl = null, prog = null, uT, uAmp, uH, uM;
  const hBuf = new Float32Array(HANDLES.length * 4);
  const mBuf = new Float32Array(HANDLES.length * 4);
  HANDLES.forEach((h, i) => { hBuf.set([h.x, h.y, h.r, 0], i * 4); });

  const VS = `attribute vec2 pos; varying vec2 uv;
    void main(){ uv = vec2(pos.x*0.5+0.5, 0.5-pos.y*0.5); gl_Position = vec4(pos,0.,1.); }`;
  const FS = `precision highp float;
    uniform sampler2D img; uniform float t; uniform float amp;
    uniform vec4 H[${HANDLES.length}]; uniform vec4 M[${HANDLES.length}];
    uniform vec4 F[${FLUTTER.length}];
    varying vec2 uv;
    const vec2 RES = vec2(${W}.0, ${H}.0);
    void main(){
      vec2 p = uv * RES; vec2 d = vec2(0.0);
      for (int i = 0; i < ${HANDLES.length}; i++) {
        vec2 v = p - H[i].xy; float q = length(v) / H[i].z;
        if (q < 1.0) {
          float w = 1.0 - q*q; w *= w;
          float a = -M[i].z * w;
          vec2 u = (v - M[i].xy * w) / (1.0 + M[i].w * w);
          vec2 s = H[i].xy + mat2(cos(a), sin(a), -sin(a), cos(a)) * u;
          d += s - p;
        }
      }
      for (int i = 0; i < ${FLUTTER.length}; i++) {
        float q = length(p - F[i].xy) / F[i].z;
        if (q < 1.0) {
          float w = 1.0 - q*q; w *= w;
          float f = float(i);
          d += w * F[i].w * amp * vec2(
            sin(p.y*0.045 + t*3.1 + f*1.7) + 0.5*sin(p.y*0.11 - t*5.3),
            0.6*cos(p.x*0.05 + t*2.3 + f));
        }
      }
      vec2 s = clamp(p + d, vec2(0.5), RES - 0.5);
      gl_FragColor = texture2D(img, s / RES);
    }`;

  function initGL() {
    gl = glCanvas.getContext("webgl", { premultipliedAlpha: false, preserveDrawingBuffer: false });
    if (!gl) return false;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "pos");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    uT = gl.getUniformLocation(prog, "t");
    uAmp = gl.getUniformLocation(prog, "amp");
    uH = gl.getUniformLocation(prog, "H");
    uM = gl.getUniformLocation(prog, "M");
    gl.uniform4fv(uH, hBuf);
    const fBuf = new Float32Array(FLUTTER.length * 4);
    FLUTTER.forEach((f, i) => fBuf.set(f, i * 4));
    gl.uniform4fv(gl.getUniformLocation(prog, "F"), fBuf);
    gl.viewport(0, 0, W, H);
    return true;
  }
  let fallback2d = null;
  function drawBase(t) {
    if (gl) {
      state.forEach((m, i) => mBuf.set([m.tx, m.ty, m.rot, m.sc], i * 4));
      gl.uniform4fv(uM, mBuf);
      gl.uniform1f(uT, t);
      gl.uniform1f(uAmp, amp);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    } else if (fallback2d) {
      fallback2d.drawImage(img, 0, 0, W, H);
    }
  }

  // ---- 太刀のきらめき ----
  // a: 手元, b: 切っ先（原画座標）
  const BLADES = [
    { a: [142, 395], b: [38, 170], period: 4.6, off: 0.3 },
    { a: [955, 258], b: [1198, 207], period: 5.2, off: 1.9 },
    { a: [1760, 146], b: [1985, 82], period: 4.1, off: 3.1 },
    { a: [975, 668], b: [1215, 568], period: 5.8, off: 0.9 },
    { a: [1540, 368], b: [1780, 515], period: 4.9, off: 2.6 },
  ];
  function drawGlints(t) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    for (const bl of BLADES) {
      const ph = ((t + bl.off) % bl.period) / 0.7;
      if (ph > 1.25) continue;
      const [ax, ay] = moved(bl.a[0], bl.a[1]);
      const [bx, by] = moved(bl.b[0], bl.b[1]);
      const g = ctx.createLinearGradient(ax, ay, bx, by);
      const c = Math.min(ph, 1);
      const lo = Math.max(0, c - 0.14), hi = Math.min(1, c + 0.14);
      g.addColorStop(0, "rgba(255,255,240,0)");
      if (lo > 0) g.addColorStop(lo, "rgba(255,255,240,0)");
      g.addColorStop(c, "rgba(255,255,245,0.85)");
      if (hi < 1) g.addColorStop(hi, "rgba(255,255,240,0)");
      g.addColorStop(1, ph >= 0.9 ? "rgba(255,255,245,0.5)" : "rgba(255,255,240,0)");
      ctx.strokeStyle = g;
      ctx.lineWidth = 5;
      ctx.globalAlpha = ph > 1 ? Math.max(0, 1 - (ph - 1) * 4) : 1;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      if (ph > 0.85) { // 切っ先の星
        const s = 26 * Math.sin(Math.min(1, (ph - 0.85) / 0.4) * Math.PI);
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = "rgba(255,255,235,0.9)";
        ctx.beginPath();
        ctx.moveTo(bx - s, by); ctx.lineTo(bx, by - s * 0.14); ctx.lineTo(bx + s, by); ctx.lineTo(bx, by + s * 0.14); ctx.closePath();
        ctx.moveTo(bx, by - s * 0.7); ctx.lineTo(bx + s * 0.1, by); ctx.lineTo(bx, by + s * 0.7); ctx.lineTo(bx - s * 0.1, by); ctx.closePath();
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // ---- 血しぶき ----
  const drops = [];
  const NECK = [1332, 350];
  const TOP_HEAD_DRIP = [1180, 105];
  function spawn(dt, t) {
    const [nx, ny] = moved(NECK[0], NECK[1]);
    const rate = (8 + 120 * pulse(t)) * Math.min(amp, 1.5);
    let n = rate * dt;
    while (n > 0) {
      if (n < 1 && Math.random() > n) break;
      n -= 1;
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.0;
      const sp = 120 + Math.random() * 330 * (0.5 + pulse(t));
      drops.push({ x: nx + (Math.random() - 0.5) * 40, y: ny + (Math.random() - 0.5) * 16,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: 1.5 + Math.random() * 4.5,
        life: 0, max: 0.7 + Math.random() * 0.8, floor: ny + 60 + Math.random() * 160 });
    }
    if (Math.random() < dt * 0.9 * amp) {
      const [hx, hy] = moved(TOP_HEAD_DRIP[0], TOP_HEAD_DRIP[1]);
      drops.push({ x: hx + (Math.random() - 0.5) * 30, y: hy, vx: (Math.random() - 0.5) * 10, vy: 20,
        r: 2 + Math.random() * 2.5, life: 0, max: 1.6, floor: 900, drip: true });
    }
  }
  function stepDrops(dt) {
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.life += dt;
      d.vy += (d.drip ? 380 : 700) * dt;
      d.x += d.vx * dt; d.y += d.vy * dt;
      if (d.y > d.floor) { d.y = d.floor; d.vx *= 0.2; d.vy = 0; d.landed = true; }
      if (d.life > d.max) drops.splice(i, 1);
    }
  }
  function drawDrops() {
    ctx.save();
    for (const d of drops) {
      const a = Math.max(0, 1 - d.life / d.max);
      ctx.globalAlpha = 0.85 * a;
      ctx.fillStyle = d.landed ? "rgb(170,38,26)" : "rgb(206,52,34)";
      ctx.beginPath();
      if (d.landed) ctx.ellipse(d.x, d.y, d.r * 1.8, d.r * 0.6, 0, 0, Math.PI * 2);
      else {
        const sp = Math.hypot(d.vx, d.vy), st = Math.min(3, 1 + sp / 250);
        ctx.ellipse(d.x, d.y, d.r * st, d.r, Math.atan2(d.vy, d.vx), 0, Math.PI * 2);
      }
      ctx.fill();
    }
    ctx.restore();
  }

  // ---- すやり霞 ----
  const MIST = [
    { y: 58, h: 64, len: 560, speed: -14, x: 300 },
    { y: 112, h: 34, len: 360, speed: -9, x: 1500 },
    { y: 790, h: 70, len: 640, speed: -11, x: 900 },
    { y: 858, h: 48, len: 440, speed: -17, x: 1900 },
    { y: 26, h: 40, len: 420, speed: -7, x: 1250 },
  ];
  function mistBand(x, y, len, h, alpha) {
    const r = h / 2;
    ctx.save();
    ctx.globalAlpha = alpha;
    const g = ctx.createLinearGradient(0, y - r, 0, y + r);
    g.addColorStop(0, "#a9c6d8"); g.addColorStop(0.5, "#8fb2c9"); g.addColorStop(1, "#7aa0ba");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x + r, y - r);
    ctx.lineTo(x + len - r * 1.4, y - r);
    ctx.bezierCurveTo(x + len + r * 0.4, y - r, x + len + r * 0.4, y + r, x + len - r * 1.4, y + r);
    ctx.lineTo(x + r, y + r);
    ctx.bezierCurveTo(x - r * 0.9, y + r, x - r * 0.9, y - r, x + r, y - r);
    ctx.fill();
    // 霞の輪郭に沿う白い描線
    ctx.strokeStyle = "rgba(245,248,250,0.55)";
    ctx.lineWidth = 1.6;
    for (let k = 0; k < 2; k++) {
      const o = 5 + k * 7;
      ctx.beginPath();
      ctx.moveTo(x + len * 0.35, y - r + o);
      ctx.lineTo(x + r + o * 0.6, y - r + o);
      ctx.bezierCurveTo(x - r * 0.6 + o, y - r + o, x - r * 0.6 + o, y + r - o, x + r + o * 0.6, y + r - o);
      ctx.lineTo(x + len * 0.25, y + r - o);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawMist(t) {
    for (const m of MIST) {
      const span = W + m.len * 2;
      const x = (((m.x + m.speed * t) % span) + span) % span - m.len;
      mistBand(x, m.y + Math.sin(t * 0.3 + m.x) * 3, m.len, m.h, 0.42);
    }
  }

  // ---- ループ ----
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let playing = !reduce, t = 0, last = null;

  function render(dt) {
    updateHandles(t);
    drawBase(t);
    ctx.clearRect(0, 0, W, H);
    if (fallback2d === null && !gl) ctx.drawImage(img, 0, 0, W, H);
    if (mistInput.checked) drawMist(t);
    if (bloodInput.checked) {
      if (dt > 0) { spawn(dt, t); stepDrops(dt); }
      drawDrops();
    } else drops.length = 0;
    drawGlints(t);
  }
  function frame(now) {
    const dt = last === null ? 0 : Math.min(0.05, (now - last) / 1000);
    last = now;
    if (playing) { t += dt; render(dt); }
    requestAnimationFrame(frame);
  }

  playBtn.addEventListener("click", () => {
    playing = !playing;
    playBtn.textContent = playing ? "一時停止" : "再生";
  });
  ampInput.addEventListener("input", () => { amp = parseFloat(ampInput.value); if (!playing) render(0); });
  mistInput.addEventListener("change", () => { if (!playing) render(0); });
  bloodInput.addEventListener("change", () => { if (!playing) render(0); });

  // 絵巻を開き直す：右から左へ広げる
  let unrollAnim = null;
  document.getElementById("unroll").addEventListener("click", () => {
    if (unrollAnim) cancelAnimationFrame(unrollAnim);
    scroller.scrollLeft = scroller.scrollWidth;
    cover.hidden = false;
    const start = performance.now(), dur = reduce ? 1 : 3600;
    const step = now => {
      const k = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      cover.style.width = ((1 - e) * 100) + "%";
      const stageW = scroller.scrollWidth;
      if (stageW > scroller.clientWidth) {
        scroller.scrollLeft = Math.max(0, (1 - e) * stageW - scroller.clientWidth * 0.6);
      }
      if (k < 1) unrollAnim = requestAnimationFrame(step);
      else { cover.hidden = true; unrollAnim = null; }
    };
    cover.style.width = "100%";
    unrollAnim = requestAnimationFrame(step);
  });

  img.onload = () => {
    try { if (!initGL()) throw new Error("no webgl"); }
    catch (e) {
      gl = null;
      fallback2d = glCanvas.getContext("2d");
    }
    if (!playing) playBtn.textContent = "再生";
    render(0);
    scroller.scrollLeft = scroller.scrollWidth;
    requestAnimationFrame(frame);
  };
  img.src = SRC;
})();
</script>
