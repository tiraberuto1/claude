<title>酒呑童子絵巻 大江山への道</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Old+Mincho:wght@400;700&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#efe3c6;
  --paper2:#e4d3ad;
  --ink:#2a2420;
  --sumi:#5a4e42;
  --shu:#b8412e;
  --kin:#c9a445;
  --lacquer:#231b16;
  --brush:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--lacquer);color:var(--ink);font-family:var(--mincho);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.ov{position:fixed;inset:0;display:grid;place-items:safe center;padding:12px 16px;overflow-y:auto;box-sizing:border-box}
button{font-family:var(--mincho)}
.btn{font:700 15px/1 var(--mincho);letter-spacing:.12em;color:var(--ink);background:rgba(239,227,198,.92);border:1.5px solid var(--ink);border-radius:2px;padding:12px 18px;cursor:pointer}
.btn:hover{background:#f6ecd4}
.btn.primary{background:var(--shu);color:#fbf3e2;border-color:#7d2a1d}
.btn.primary:hover{background:#c64b36}
.btn.ghost{background:transparent;color:#efe3c6;border-color:rgba(239,227,198,.5)}
.btn.ghost:hover{background:rgba(239,227,198,.12)}
.btn.ghost[aria-pressed="true"]{border-color:var(--kin);color:#f0d98c}
.btn.warn{color:var(--shu);border-color:var(--shu)}
:focus-visible{outline:2px solid var(--kin);outline-offset:3px}

#title{background:linear-gradient(90deg,rgba(35,27,22,.0) 0%,rgba(35,27,22,.0) 40%,rgba(35,27,22,.55) 100%)}
.tcard{display:grid;grid-template-columns:auto minmax(0,340px);gap:28px;align-items:center;background:rgba(239,227,198,.94);border:1.5px solid var(--ink);box-shadow:0 18px 50px rgba(20,14,10,.45);padding:26px 28px 24px;max-width:calc(100vw - 32px);box-sizing:border-box;position:relative}
.tcard::before{content:"";position:absolute;inset:6px;border:1px solid rgba(42,36,32,.35);pointer-events:none}
.tcard h1{margin:0;writing-mode:vertical-rl;font:400 64px/1.05 var(--brush);letter-spacing:.08em;color:var(--ink)}
.tcard h1 small{display:block;font-size:24px;color:var(--shu);margin-top:.4em;letter-spacing:.2em}
.tside{display:grid;gap:14px}
.kicker{margin:0;font:700 12px/1 var(--mincho);letter-spacing:.3em;color:var(--shu)}
.lead{margin:0;font:400 26px/1.4 var(--brush);letter-spacing:.06em}
.desc{margin:0;font-size:14px;line-height:1.85;color:var(--sumi)}
.hist{margin:0;font-size:13px;line-height:1.7;color:var(--ink);border-top:1px solid rgba(42,36,32,.25);padding-top:10px}
.hist:empty{display:none}
.row{display:flex;flex-wrap:wrap;gap:10px}
.keys{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;color:var(--sumi)}
.keys dt{font-weight:700;color:var(--ink);white-space:nowrap}
.keys dd{margin:0}
.clear{justify-self:start;background:none;border:0;padding:0;font-size:12px;color:var(--sumi);text-decoration:underline;cursor:pointer}
.clear.arm{color:var(--shu);font-weight:700}

#story{background:#0d0a08;color:#efe3c6;text-align:center;transition:opacity .9s ease;opacity:0;pointer-events:none}
#story.show{opacity:1;pointer-events:auto}
#story h2{margin:0;font:400 clamp(40px,8vw,76px)/1.2 var(--brush);letter-spacing:.2em;opacity:0;transition:opacity 1.1s ease .5s}
#story p{margin:14px 0 0;font-size:16px;letter-spacing:.3em;color:#c9b88f;opacity:0;transition:opacity 1s ease 1.3s}
#story.show h2,#story.show p{opacity:1}

#emakiBar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:center;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(0deg,rgba(20,14,10,.92),rgba(20,14,10,.6) 70%,rgba(20,14,10,0))}
#emakiBar .btn{font-size:13px;padding:10px 13px}
#emakiHint{flex-basis:100%;text-align:center;margin:0;font-size:12px;letter-spacing:.12em;color:#bfae88}
#saveMsg{font-size:12px;color:#f0d98c;letter-spacing:.08em}

#touch{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);pointer-events:none}
#touch .grp{display:flex;gap:12px;pointer-events:auto}
#touch button{width:68px;height:68px;border-radius:50%;border:2px solid rgba(42,36,32,.75);background:rgba(239,227,198,.55);font:400 24px/1 var(--brush);color:var(--ink);touch-action:none}
#touch button.on{background:rgba(184,65,46,.75);color:#fbf3e2}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;font:700 12px/1 var(--mincho);letter-spacing:.1em;padding:8px 10px;background:rgba(239,227,198,.85);border:1px solid var(--ink);border-radius:2px;cursor:pointer;color:var(--ink)}
#rotate{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);margin:0;font-size:12px;letter-spacing:.1em;color:#efe3c6;background:rgba(20,14,10,.7);padding:6px 12px;border-radius:2px;white-space:nowrap}
@media (max-width:640px){
  .tcard{grid-template-columns:1fr;gap:14px;padding:20px 18px}
  .tcard h1{writing-mode:horizontal-tb;font-size:44px}
  .tcard h1 small{display:inline;margin:0 0 0 .5em;font-size:18px}
  .lead{font-size:21px}
  .keys{display:none}
}
@media (orientation:landscape),(min-width:700px){#rotate{display:none}}
@media (max-height:520px){
  .tcard{grid-template-columns:auto minmax(0,400px);gap:18px;padding:14px 18px}
  .tcard h1{font-size:40px}
  .tcard h1 small{font-size:18px}
  .lead{font-size:19px}
  .desc{font-size:12.5px;line-height:1.6}
  .tside{gap:9px}
  .keys{display:none}
  .btn{padding:10px 14px}
}
@media (pointer:coarse){.keys{display:none}}
@media (pointer:coarse) and (orientation:landscape){
  #touch{padding:0 10px calc(env(safe-area-inset-bottom,0px) + 8px)}
  #touch .grp{gap:8px}
  #touch button{width:56px;height:56px;font-size:20px;background:rgba(239,227,198,.32);border-color:rgba(42,36,32,.55)}
}
@media (prefers-reduced-motion:reduce){#story,#story h2,#story p{transition:none}}
</style>

<canvas id="cv" aria-label="酒呑童子絵巻アクションゲームの画面"></canvas>

<section id="title" class="ov" aria-labelledby="tTitle">
  <div class="tcard">
    <h1 id="tTitle">酒呑童子絵巻<small>大江山への道</small></h1>
    <div class="tside">
      <p class="kicker">絵巻アクション　試作一段</p>
      <p class="lead">自分のプレイが、絵巻になる。</p>
      <p class="desc">源頼光となり、右から左へ大江山を目指す。道中三か所の「記録の場」で取った姿──斬る、跳ぶ、佇む、打たれる──が、そのまま一巻の絵に描かれる。何度も挑めば、同じ場所に異なる時の頼光が並ぶ。</p>
      <p class="hist" id="hist"></p>
      <div class="row">
        <button id="bStart" class="btn primary" type="button">大江山へ向かう</button>
        <button id="bView" class="btn" type="button" hidden>これまでの絵巻を見る</button>
      </div>
      <dl class="keys">
        <dt>← →　A D</dt><dd>歩く（左が大江山）</dd>
        <dt>Z　Space　↑</dt><dd>跳ぶ</dd>
        <dt>X　J</dt><dd>斬る（空中で斬ると跳び斬り）</dd>
        <dt>M</dt><dd>音の入り切り</dd>
      </dl>
      <button id="bClear" class="clear" type="button" hidden>これまでの記録を消す</button>
    </div>
  </div>
</section>

<section id="story" class="ov" hidden aria-live="polite">
  <div><h2>あなたの物語</h2><p id="storySub">あなたの絵巻が完成しました</p></div>
</section>

<div id="emakiBar" hidden>
  <button id="bAuto" class="btn ghost" type="button" aria-pressed="true">自動で読む</button>
  <button id="bLayer" class="btn ghost" type="button" aria-pressed="true">異時同図（すべての回を重ねる）</button>
  <button id="bSave" class="btn ghost" type="button" hidden>絵巻を画像で保存</button>
  <button id="bAgain" class="btn primary" type="button">もう一度 大江山へ</button>
  <button id="bHome" class="btn ghost" type="button">表紙へ戻る</button>
  <span id="saveMsg" role="status"></span>
  <p id="emakiHint">絵巻は右から左へ読む ── ドラッグ・ホイール・← → キーで巻き進める</p>
</div>

<div id="touch" hidden>
  <div class="grp"><button id="tL" type="button" aria-label="左へ歩く">◀</button><button id="tR" type="button" aria-label="右へ歩く">▶</button></div>
  <div class="grp"><button id="tJ" type="button" aria-label="跳ぶ">跳</button><button id="tA" type="button" aria-label="斬る">斬</button></div>
</div>
<button id="mute" type="button" aria-pressed="false">音　入</button>
<p id="rotate" hidden>横向きにすると遊びやすくなります</p>

<script>
(() => {
'use strict';
// ============================================================ basics
const W = 960, H = 540;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let DPR = 1, VW = 0, VH = 0, gS = 1, gOX = 0, gOY = 0;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const KNUM = ['〇','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十'];
const kn = n => { if (n <= 20) return KNUM[n] || String(n); if (n < 100) { const t = Math.floor(n / 10), o = n % 10; return (t > 1 ? KNUM[t] : '') + '十' + (o ? KNUM[o] : ''); } return String(n); };
const FONT_BRUSH = '"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
const FONT_MIN = '"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
const INK = '#2a2420', SHU = '#b8412e', KIN = '#c9a445', PAPER = '#efe3c6';

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  gS = Math.min(VW / W, VH / H); gOX = (VW - W * gS) / 2; gOY = (VH - H * gS) / 2;
  if (emaki.canvas) { emaki.needsFit = true; emaki.fitAt = performance.now() + 220; }
  positionMute();
}
addEventListener('resize', resize);

// ============================================================ audio
const audio = { ctx: null, muted: false };
function ac() {
  if (audio.muted) return null;
  if (!audio.ctx) { try { audio.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (audio.ctx.state === 'suspended') audio.ctx.resume();
  return audio.ctx;
}
function tone(freq, freq2, dur, type, vol, delay = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, freq2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, hp, delay = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay, n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(); s.buffer = b; const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = a.createGain(); g.gain.value = vol; s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const SFX = {
  slash() { noise(0.12, 0.22, 2400); },
  hit() { tone(160, 60, 0.14, 'square', 0.12); noise(0.08, 0.2, 800); },
  hurt() { tone(220, 70, 0.3, 'sawtooth', 0.12); },
  jump() { tone(300, 520, 0.1, 'triangle', 0.08); },
  record() { tone(210, 90, 0.5, 'sine', 0.35); tone(420, 380, 0.08, 'triangle', 0.08); tone(160, 80, 0.45, 'sine', 0.2, 0.28); },
  roar() { tone(90, 45, 1.1, 'sawtooth', 0.16); noise(0.9, 0.08, 200); },
  slam() { tone(70, 30, 0.5, 'sine', 0.4); noise(0.35, 0.25, 120); },
  down() { tone(260, 60, 1.2, 'triangle', 0.14); },
  gate() { tone(110, 80, 1.4, 'square', 0.06); noise(1.2, 0.05, 300); },
  win() { [392, 523, 659].forEach((f, i) => tone(f, f, 0.5, 'triangle', 0.1, i * 0.18)); },
};
function positionMute() {
  const m = $('mute'); if (!m) return;
  if (state === 'play' || state === 'story') { m.style.top = Math.round(gOY + 62 * gS) + 'px'; m.style.right = Math.max(12, Math.round(VW - gOX - W * gS + 16 * gS)) + 'px'; }
  else { m.style.top = ''; m.style.right = ''; }
}
function toggleMute() {
  audio.muted = !audio.muted;
  $('mute').textContent = audio.muted ? '音　切' : '音　入';
  $('mute').setAttribute('aria-pressed', audio.muted ? 'true' : 'false');
  if (audio.muted && audio.ctx) audio.ctx.suspend();
}
$('mute').addEventListener('click', toggleMute);

// ============================================================ figures (大和絵 vector painters)
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); return [c, g]; }
// Shared palettes. Painters must take every colour from the palette argument P (never literals),
// so the game can repaint a figure white for a hit-flash or grey for a ghost.
const RAIKO_PAL = {
  ink: '#2a2420',      // 墨 outline
  skin: '#f2e3cb',     // 胡粉 face / hands
  lip: '#c0432f',      // 朱 lips
  hair: '#2a2420',     // hair / beard
  lac: '#2f2926',      // black lacquer: helmet bowl, armour plates
  shu: '#c0432f',      // 緋縅 red lacing (main armour colour)
  shu2: '#dd6a4a',     // lighter lacing highlight
  kin: '#c9a445',      // gold: 鍬形, fittings, tsuba
  white: '#f3ecdc',    // 胡粉 white: inner robe
  gunjo: '#2f4d86',    // 群青: 鎧直垂 sleeves / hakama
  gunjo2: '#4d6aa0',   // lighter 群青 for pattern
  rokusho: '#3f7d66',  // 緑青 accents (cords)
  blade: '#e9eef0', blade2: '#9fb0b6', hilt: '#6e3b28',
  shade: 'rgba(42,36,32,0.16)', // 隈 soft shading, use sparingly
};
const ONI_PALS = {
  oni:   { ink: '#2a2420', skin: '#c9503a', skin2: '#9b3526', hair: '#2a2420', horn: '#efe6cf', eye: '#e9c34a', pupil: '#2a2420', fang: '#f6f0e2', mouth: '#6d1d18', cloth: '#d9a441', stripe: '#2a2420', club: '#3d3a40', stud: '#c9c3b5', kin: '#c9a445', white: '#f3ecdc', shade: 'rgba(42,36,32,0.18)' },
  aooni: { ink: '#2a2420', skin: '#4a78a8', skin2: '#2f5379', hair: '#2a2420', horn: '#efe6cf', eye: '#e9c34a', pupil: '#2a2420', fang: '#f6f0e2', mouth: '#6d1d18', cloth: '#d9a441', stripe: '#2a2420', club: '#3d3a40', stud: '#c9c3b5', kin: '#c9a445', white: '#f3ecdc', shade: 'rgba(42,36,32,0.18)' },
  ooni:  { ink: '#2a2420', skin: '#a3302a', skin2: '#6d1d18', hair: '#ece5d2', horn: '#d9b24a', eye: '#f3dc6a', pupil: '#2a2420', fang: '#f6f0e2', mouth: '#4a120e', cloth: '#d9a441', stripe: '#2a2420', club: '#2f2a2e', stud: '#d9b24a', kin: '#d9b24a', white: '#f3ecdc', shade: 'rgba(42,36,32,0.2)' },
};
function flatPal(P, colour) { const o = {}; for (const k of Object.keys(P)) o[k] = k === 'shade' ? 'rgba(0,0,0,0)' : colour; return o; }
const RAIKO_POSES = [['idle',0],['idle',1],['walk',0],['walk',1],['walk',2],['walk',3],['jump',0],['atk',0],['atk',1],['atk',2],['jatk',0],['jatk',1],['jatk',2],['hurt',0],['down',0],['victory',0]];
const ONI_POSES = [['idle',0],['idle',1],['walk',0],['walk',1],['walk',2],['walk',3],['windup',0],['swing',0],['recover',0],['hurt',0],['jump',0],['roar',0],['dead',0]];
// bounding boxes in painter units, origin = feet centre on the ground, +x = facing direction, -y = up
const RAIKO_BOX = { x0: -28, x1: 32, y0: -52, y1: 4 };
const ONI_BOX = { x0: -32, x1: 40, y0: -60, y1: 4 };

// 源頼光 painter — 狩野元信「酒呑童子絵巻」風: 鉄線描の墨線, 緋縅大鎧, 群青の鎧直垂, 引目鉤鼻, 金の鍬形, 反りの深い太刀.
// Contract: paintRaiko(g, pose, f, P). 1 unit = 1 painter unit, origin = feet centre, +x = facing, -y = up.
function rk_pose(pose, f) {
  const p = { hip: [0, -13], lean: 0.03, feet: [[-3.5, 0], [3.5, 0]], hand: [5, -15.5], ang: -1.0, far: [-3.6, -14.6],
    fl: [-0.6, 3.6], tilt: 0, behind: false, arc: null, sword: true, down: false, sway: 0 };
  f = f | 0;
  if (pose === 'idle') {
    const b = (f % 2) * 0.35; p.hip = [0, -13 + b]; p.hand = [5, -15.5 + b]; p.far = [-3.6, -14.6 + b]; p.fl = [-0.6, 3.6 + b];
  } else if (pose === 'walk') {
    const k = ((f % 4) + 4) % 4, sw = [1.2, 0, -1.2, 0][k];
    p.feet = [[[-5.5, 0], [5, 0]], [[-1.2, -2.2], [1.6, 0]], [[5, 0], [-5.5, 0]], [[1.6, 0], [-1.2, -2.2]]][k];
    p.hip = [0.4, -13 + (k % 2 ? -0.5 : 0)]; p.lean = 0.08;
    p.hand = [5.2 + sw, -15.8 + (k % 2 ? -0.5 : 0)]; p.far = [-3.4 - sw, -15.2 + (k % 2 ? -0.5 : 0)];
    p.ang = -0.8; p.fl = [-2.6, 3]; p.sway = -0.6;
  } else if (pose === 'jump') {
    p.hip = [0, -18]; p.feet = [[-3.6, -8.2], [2.4, -6.6]]; p.lean = 0.08;
    p.hand = [5.6, -27.6]; p.ang = -1.15; p.far = [-6.5, -24]; p.fl = [0.4, 4]; p.sway = 0.4;
  } else if (pose === 'atk' || pose === 'jatk') {
    const air = pose === 'jatk', ph = Math.max(0, Math.min(2, f));
    if (air) { p.hip = [0, -18]; p.feet = [[-3.6, -8.2], [2.4, -6.6]]; }
    else p.feet = [[-6.5, 0], [6.5, 0]];
    if (ph === 0) {
      if (!air) p.hip = [-0.6, -12]; p.lean = -0.14;
      p.hand = [-2.4, air ? -35.5 : -30]; p.ang = -2.62; p.far = [-1.2, air ? -34.2 : -28.8];
      p.fl = [-1.2, 3.6]; p.behind = true; p.armBack = true; p.tilt = -0.08;
    } else if (ph === 1) {
      if (!air) { p.hip = [1.6, -11.4]; p.feet = [[-7.5, 0], [7, 0]]; }
      p.lean = 0.3; p.fl = [-5, 1.6]; p.far = [-8, air ? -24 : -18.5]; p.sway = -1.1; p.tilt = 0.1;
      if (air) { p.hand = [10, -23]; p.ang = 0.55; p.arc = [-2.3, 0.55]; }
      else { p.hand = [10.4, -19.6]; p.ang = 0.04; p.arc = [-2.1, 0.02]; }
    } else {
      if (!air) { p.hip = [1.2, -11.6]; p.feet = [[-7, 0], [6.8, 0]]; }
      p.lean = 0.26; p.fl = [-3.4, -1.8]; p.far = [-7.4, air ? -26 : -21]; p.sway = -0.8; p.tilt = 0.12;
      p.hand = air ? [8.2, -18] : [8.6, -14.6]; p.ang = air ? 1.2 : 0.92;
    }

}
function drawGroupHero(g, it, grp) {
  const sc = grp.scale, p = grp.snap.player;

    g.fillStyle = SHU; g.fillRect(bx - 13, ty - 16, 26, 26); g.fillStyle = '#fbf3e2'; g.font = `18px ${FONT_BRUSH}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('今', bx, ty - 3);
  } else {
    const label = kn(grp.run.n) + '度目';
    g.fillStyle = 'rgba(246,240,226,.95)'; g.strokeStyle = INK; g.lineWidth = 1;
    const hgt = [...label].length * 16 + 10; g.fillRect(bx - 11, ty - hgt + 8, 22, hgt); g.strokeRect(bx - 11, ty - hgt + 8, 22, hgt);
    vtext(g, label, bx, ty - hgt + 11, 14, INK);

}

function paintItem(g, it, ctxInfo) {
  const { runs, cur, many, rng, anyClear } = ctxInfo;
  const { x0, x1, w } = it;
  if (it.k === 'cover') {
    g.fillStyle = '#2b3558'; g.fillRect(x0, 0, w, PH);
    g.strokeStyle = 'rgba(201,164,69,.55)'; g.lineWidth = 1.2;
    for (let y = 0; y < PH; y += 34) for (let x = x0; x < x1; x += 40) { const ox = (Math.floor(y / 34) % 2) * 20; g.beginPath(); for (let a = 0; a < 6; a++) { const t = a / 6 * Math.PI * 2 + Math.PI / 6; const qx = x + ox + Math.cos(t) * 13, qy = y + Math.sin(t) * 13; a ? g.lineTo(qx, qy) : g.moveTo(qx, qy); } g.closePath(); g.stroke(); }
    g.fillStyle = 'rgba(201,164,69,.8)'; for (let y = 17; y < PH; y += 34) for (let x = x0 + 20; x < x1; x += 40) g.fillRect(x + (Math.floor(y / 34) % 2) * 20 - 1.5, y - 1.5, 3, 3);
    const sx = x1 - 110;
    g.fillStyle = '#f4ecd8'; g.fillRect(sx - 30, 60, 60, 330); g.strokeStyle = KIN; g.lineWidth = 2; g.strokeRect(sx - 30, 60, 60, 330);
    vtext(g, '酒呑童子絵巻', sx, 84, 38, INK);
    g.fillStyle = '#f4ecd8'; g.fillRect(sx - 88, 60, 34, 210); g.strokeRect(sx - 88, 60, 34, 210);
    vtext(g, many ? '異時同図の巻' : `其の${kn(cur.n)}`, sx - 71, 80, 20, INK);
    g.fillStyle = '#6a2c20'; g.fillRect(x0, 0, 14, PH);
    g.fillStyle = '#c9a445'; g.fillRect(x0 + 14, 0, 3, PH);
    return;
  }
  if (it.k === 'mikaeshi') {
    g.fillStyle = '#d7bb66'; g.fillRect(x0, 0, w, PH);
    for (let k = 0; k < 900; k++) { g.fillStyle = rng() < 0.5 ? 'rgba(255,240,180,.7)' : 'rgba(150,110,40,.35)'; const s = 1 + rng() * 5; g.fillRect(x0 + rng() * w, rng() * PH, s, s); }
    return;
  }
  if (it.spec && it.k !== 'okugaki') {
    const sp = it.spec;
    vcolumns(g, sp.paras, x1 - sp.pad, sp.top, sp.colH, sp.size, INK, sp.gap);
    return;
  }
  if (it.k === 'scene') {
    sceneBackground(g, it, rng);
    const sec = it.sec, groups = [];
    for (const r of runs) {
      if (sec.point && r.records[sec.point]) groups.push({ run: r, snap: r.records[sec.point], current: r.n === cur.n });
      if (r.end && r.end.sec === it.i) groups.push({ run: r, snap: r.end, current: r.n === cur.n, isEnd: true });
    }
    if (sec.id === 'depart' && !groups.length) {
      drawSprite(g, 'raiko', 'walk', 1, it.x1 - 320, 472, 3, -1, null, 1);
      return;
    }
    for (const grp of groups) {
      if (grp.isEnd) continue;
      const end = groups.find(o => o.isEnd && o.run === grp.run);
      if (!end) continue;
      if (Math.abs(emX(it, end.snap.player.x) - emX(it, grp.snap.player.x)) < 120) grp.drop = true;
      else grp.skip = new Set(end.snap.enemies.map(e => e.id));
    }
    const live = groups.filter(g2 => !g2.drop).sort((a, b) => (b.run.n - a.run.n) || (a.isEnd ? -1 : 1)).slice(0, 7);
    const placed = [], lo = it.x0 + 70, hi = it.x1 - 70;
    const OFFS = [0, 1, -1, 2, -2, 3, -3, 4, -4];
    for (const grp of live) {
      const base = emX(it, grp.snap.player.x);
      let best = null;
      for (const k of OFFS) {
        const x = clamp(base + k * 150, lo, hi);
        if (placed.every(o => Math.abs(o - x) >= 120)) { best = { k, x }; break; }
      }
      if (!best) best = { k: OFFS[placed.length % OFFS.length], x: clamp(base + OFFS[placed.length % OFFS.length] * 150, lo, hi) };
      const depth = Math.abs(best.k);
      grp.dx = best.x - base; grp.dy = -10 * depth; grp.scale = Math.pow(0.95, depth);
      placed.push(best.x);
    }
    const order = live.slice().sort((a, b) => a.dy - b.dy);
    for (const grp of order) drawGroupEnemies(g, it, grp);
    for (const grp of order) drawGroupHero(g, it, grp);
    return;
  }
  if (it.k === 'okugaki') {
    const sp = it.spec;
    vcolumns(g, sp.paras, x1 - sp.pad, sp.top, sp.colH, sp.size, INK, sp.gap);
    g.fillStyle = SHU; g.fillRect(x0 + 150, 380, 64, 64); g.strokeStyle = '#7d2a1d'; g.lineWidth = 2; g.strokeRect(x0 + 156, 386, 52, 52);
    g.fillStyle = '#fbf3e2'; g.font = `24px ${FONT_BRUSH}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('頼', x0 + 182, 400); g.fillText('光', x0 + 182, 426);
    const rg = g.createLinearGradient(x0, 0, x0 + 34, 0); rg.addColorStop(0, '#3b2418'); rg.addColorStop(0.5, '#8a5a36'); rg.addColorStop(1, '#3b2418');
    g.fillStyle = rg; g.fillRect(x0, 0, 34, PH);
    return;
  }
  if (it.k === 'torn') {
    g.fillStyle = 'rgba(90,78,66,.75)'; vtext(g, '── この先、絵巻は途切れている ──', x1 - 90, 90, 20, 'rgba(90,78,66,.8)');
    g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.moveTo(x0, 0);
    for (let y = 0; y <= PH; y += 12) g.lineTo(x0 + 70 + rng() * 60 + Math.sin(y * 0.05) * 20, y);
    g.lineTo(x0, PH); g.closePath(); g.fill(); g.globalCompositeOperation = 'source-over';
    g.strokeStyle = 'rgba(120,96,60,.35)'; g.lineWidth = 1;
    return;
  }
}

function openEmaki(currentN, fromRun) {
  state = 'emaki';
  emaki.current = currentN; emaki.auto = !matchMedia('(prefers-reduced-motion: reduce)').matches; emaki.layered = true;
  rebuildEmaki();
  emaki.scrollX = emaki.width;
  emaki.openT = fromRun ? -1.0 : 0;
  $('title').hidden = true; $('touch').hidden = true; $('rotate').hidden = true;
  $('bAuto').setAttribute('aria-pressed', emaki.auto ? 'true' : 'false');
  $('bLayer').setAttribute('aria-pressed', 'true');
  $('saveMsg').textContent = '';
  $('emakiHint').textContent = coarse ? '絵巻は右から左へ読む ── 指でなぞって巻き進める' : '絵巻は右から左へ読む ── ドラッグ・ホイール・← → キーで巻き進める';
  const st = $('story'), bar = $('emakiBar');
  const showBar = () => { if (state !== 'emaki') return; bar.hidden = false; emaki.fitAt = 0; emaki.needsFit = true; positionMute(); $('bAuto').focus({ preventScroll: true }); };
  if (fromRun) { setTimeout(() => { st.classList.remove('show'); setTimeout(() => { st.hidden = true; showBar(); }, 900); }, 150); }
  else { st.hidden = true; st.classList.remove('show'); showBar(); }
}
function viewMetrics() {
  const bar = $('emakiBar'), barH = bar.hidden ? 96 : (bar.offsetHeight || 96), top = 44;
  let vs = clamp((VH - barH - top - 36) / PH, 0.35, 1.6);
  if (VW < VH) vs = Math.min(vs, (VW - 32) / (PH * 0.9));
  const paperW = Math.min(VW - 32, emaki.width * vs);
  const x = (VW - paperW) / 2, y = Math.max(top, top + (VH - barH - top - 36 - PH * vs) / 2);
  return { vs, paperW, x, y, winW: paperW / vs };
}
function rebuildEmaki() {
  const { vs } = viewMetrics();
  const b = buildEmaki(emaki.current, emaki.layered, Math.min(2, vs * DPR));
  const rightAligned = emaki.width ? emaki.width - emaki.scrollX : 0;
  Object.assign(emaki, b);
  emaki.scrollX = clamp(emaki.width - rightAligned, 0, emaki.width);
  emaki.needsFit = false;
}
function updateEmaki(dt) {
  emaki.openT += dt;
  const m = viewMetrics();
  if (emaki.auto && !emaki.drag && emaki.openT > 0.6) emaki.scrollX -= 95 * dt;
  emaki.scrollX = clamp(emaki.scrollX, m.winW, Math.max(m.winW, emaki.width));
  if (emaki.scrollX <= m.winW + 0.5 && emaki.auto) { emaki.auto = false; $('bAuto').setAttribute('aria-pressed', 'false'); }
}
function renderEmaki() {
  const g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = g.createLinearGradient(0, 0, 0, VH); bg.addColorStop(0, '#2b211b'); bg.addColorStop(1, '#171210'); g.fillStyle = bg; g.fillRect(0, 0, VW, VH);
  g.strokeStyle = 'rgba(255,230,190,.03)'; g.lineWidth = 1; g.beginPath(); for (let y = 0; y < VH; y += 7) { g.moveTo(0, y + Math.sin(y) * 2); g.lineTo(VW, y); } g.stroke();
  if (!emaki.canvas) return;
  const m = viewMetrics();
  const reveal = clamp(emaki.openT / 1.2, 0, 1), ease = 1 - Math.pow(1 - reveal, 3);
  const winW = m.winW * ease;
  const right = emaki.scrollX, left = right - winW;
  const dx = m.x + m.paperW - winW * m.vs;
  g.imageSmoothingEnabled = true;
  const s = emaki.scale;
  if (winW > 1) {
    g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(dx + 4, m.y + 10, winW * m.vs, PH * m.vs);
    g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(dx + 8, m.y + 16, winW * m.vs, PH * m.vs);
    g.drawImage(emaki.canvas, Math.max(0, left * s), 0, winW * s, PH * s, dx, m.y, winW * m.vs, PH * m.vs);
  }
  const rollW = 22 * Math.max(0.7, m.vs);
  const roller = (x, label) => {
    const gr = g.createLinearGradient(x - rollW / 2, 0, x + rollW / 2, 0);
    gr.addColorStop(0, '#6f5334'); gr.addColorStop(0.35, '#e6d6ae'); gr.addColorStop(0.6, '#cdb98b'); gr.addColorStop(1, '#5a4128');
    g.fillStyle = gr; g.fillRect(x - rollW / 2, m.y - 8, rollW, PH * m.vs + 16);
    g.fillStyle = '#3a2618'; g.fillRect(x - rollW / 2 - 3, m.y - 16, rollW + 6, 10); g.fillRect(x - rollW / 2 - 3, m.y + PH * m.vs + 6, rollW + 6, 10);
    void label;
  };
  if (left > 1) roller(dx, 'unread');
  if (right < emaki.width - 1) roller(dx + winW * m.vs, 'read');
  const prog = 1 - (emaki.scrollX - m.winW) / Math.max(1, emaki.width - m.winW);
  g.fillStyle = 'rgba(239,227,198,.25)'; g.fillRect(m.x, m.y + PH * m.vs + 22, m.paperW, 2);
  g.fillStyle = '#c9a445'; g.fillRect(m.x + m.paperW * (1 - clamp(prog, 0, 1)), m.y + PH * m.vs + 20, Math.max(4, m.paperW * clamp(prog, 0, 1)), 6);
  if (emaki.openT < 3.2 && emaki.openT > 0.3) {
    g.globalAlpha = clamp(Math.min(emaki.openT - 0.3, 3.2 - emaki.openT), 0, 1);
    g.fillStyle = '#efe3c6'; g.font = `18px ${FONT_BRUSH}`; g.textAlign = 'center'; g.textBaseline = 'bottom';
    g.fillText('── 右から左へ、あなたの冒険を読む ──', VW / 2, m.y - 12);
    g.globalAlpha = 1;

}
function emakiKey(e) {
  if (e.code === 'Space') {
    e.preventDefault(); if (e.repeat) return;
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    emaki.auto = !emaki.auto; $('bAuto').setAttribute('aria-pressed', emaki.auto ? 'true' : 'false'); return;
  }
  if (e.repeat && emaki.openT < 1.5) return;
  const m = viewMetrics();
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { emaki.scrollX -= m.winW * 0.35; stopAuto(); e.preventDefault(); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { emaki.scrollX += m.winW * 0.35; stopAuto(); e.preventDefault(); }
}
function stopAuto() { if (emaki.auto) { emaki.auto = false; $('bAuto').setAttribute('aria-pressed', 'false'); } }
cv.addEventListener('pointerdown', e => { if (state !== 'emaki') return; cv.setPointerCapture(e.pointerId); emaki.drag = { x: e.clientX }; stopAuto(); });
cv.addEventListener('pointermove', e => { if (state !== 'emaki' || !emaki.drag) return; const m = viewMetrics(); emaki.scrollX -= (e.clientX - emaki.drag.x) / m.vs; emaki.drag.x = e.clientX; });
const endDrag = () => { emaki.drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('wheel', e => { if (state !== 'emaki') return; e.preventDefault(); const m = viewMetrics(); emaki.scrollX -= (e.deltaY + e.deltaX) / m.vs; stopAuto(); }, { passive: false });

// ============================================================ UI wiring
function refreshTitle() {
  const n = history.length;
  const last = history[history.length - 1];
  $('hist').textContent = n ? `これまでに${kn(last.n)}たび、頼光は大江山を目指した。前回は${last.outcome === 'clear' ? '大鬼を討ち果たした' : `「${(SECTIONS[last.end ? last.end.sec : 0] || SECTIONS[0]).title}」で倒れた`}。同じ場所に、いまの頼光と過去の頼光が並んで描かれる。` : '';
  $('bView').hidden = !n; $('bClear').hidden = !n;
  $('bClear').classList.remove('arm'); $('bClear').textContent = 'これまでの記録を消す';
}
function toTitle() {
  state = 'title';
  $('emakiBar').hidden = true; $('touch').hidden = true; $('title').hidden = false;
  const st = $('story'); st.classList.remove('show'); st.hidden = true;
  refreshTitle();
  G.camX = WORLD_W - W;
  $('rotate').hidden = true; positionMute();
  $('bStart').focus({ preventScroll: true });
}
function startGame() {
  ac(); newRun(); state = 'play';
  $('title').hidden = true; $('emakiBar').hidden = true; $('story').hidden = true; $('story').classList.remove('show');
  $('touch').hidden = !coarse; $('rotate').hidden = false;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  positionMute();
  keys.clear();
  input.left = input.right = input.jump = input.atk = input.jumpP = input.atkP = false;
}
$('bStart').addEventListener('click', startGame);
$('bAgain').addEventListener('click', startGame);
$('bHome').addEventListener('click', toTitle);
$('bView').addEventListener('click', () => { if (history.length) openEmaki(history[history.length - 1].n, false); });
$('bClear').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = '本当に消す（もう一度押す）'; return; }
  history = []; saveHistory(); refreshTitle();
});
$('bAuto').addEventListener('click', e => { emaki.auto = !emaki.auto; e.currentTarget.setAttribute('aria-pressed', emaki.auto ? 'true' : 'false'); });
$('bLayer').addEventListener('click', e => {
  emaki.layered = !emaki.layered; e.currentTarget.setAttribute('aria-pressed', emaki.layered ? 'true' : 'false');
  const readFromRight = emaki.width - emaki.scrollX;
  rebuildEmaki(); emaki.scrollX = clamp(emaki.width - readFromRight, 0, emaki.width);
});
let downloads = null;
(async () => {
  try { if (window.claude && typeof window.claude.use === 'function') downloads = await window.claude.use('downloads'); } catch (e) { downloads = null; }
  if (downloads) $('bSave').hidden = false;
})();
$('bSave').addEventListener('click', async () => {
  if (!downloads) return;
  const msg = $('saveMsg'); msg.textContent = '絵巻を描き起こしています…';
  try {
    const b = buildEmaki(emaki.current, emaki.layered, 1);
    const blob = await new Promise(res => b.canvas.toBlob(res, 'image/png'));
    if (!blob) throw { code: 'bad_request' };
    const r = await downloads.save({ filename: `酒呑童子絵巻_其の${kn(emaki.current)}.png`, data: blob });
    msg.textContent = r && r.status === 'delivered' ? '絵巻を届けました' : '絵巻を保存しました';
  } catch (err) {
    const code = err && err.code;
    msg.textContent = code === 'declined' ? '保存を取りやめました' : code === 'rate_limited' ? '少し待ってからもう一度押してください' : 'この画面では保存できません';
    if (code === 'unavailable' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') $('bSave').hidden = true;
  }
});

// ============================================================ loop
let last = performance.now(), titleT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const time = now / 1000;
  try {
    if (state === 'play') updatePlay(dt);
    else if (state === 'story') { G.time += dt; if (G.player) { G.player.downT += dt; } }
    else if (state === 'title') { titleT += dt; G.camX = (WORLD_W - W) - ((titleT * 40) % (WORLD_W - W)); }
    if (state === 'emaki') { if (emaki.needsFit && now >= emaki.fitAt) rebuildEmaki(); updateEmaki(dt); renderEmaki(); }
    else renderGame(time);
  } finally { requestAnimationFrame(frame); }
}
resize();
refreshTitle();
if (document.fonts && document.fonts.load) Promise.race([document.fonts.load(`30px ${FONT_BRUSH}`), new Promise(r => setTimeout(r, 2500))]);
requestAnimationFrame(frame);
window.__shuten = { G, get state() { return state; }, history: () => history, emaki, input, openEmaki, startGame };
})();
</script>
