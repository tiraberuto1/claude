name: フキダシ翻訳（Android）

on:
  push:
    paths:
      - "comic-translator/**"
      - ".github/workflows/fukidashi-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comic-translator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: テストと APK のビルド
        run: ./gradlew :core:test :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: fukidashi-translator-debug-apk
          path: comic-translator/app/build/outputs/apk/debug/*.apk
