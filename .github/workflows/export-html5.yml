name: HTML5 エクスポート

on:
  push:
    branches: [ claude/elegant-hamilton-btgva3 ]
    paths:
      - 'shuten-doji-animation-prototype/**'
      - '.github/workflows/export-html5.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot 4.3 セットアップ
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3
          use-dotnet: false

      - name: HTML5 エクスポート
        working-directory: shuten-doji-animation-prototype
        run: |
          godot --headless --export-release "Web" ../html5/index.html

      - name: GitHub Pages にアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'html5'

  deploy:
    needs: export
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
