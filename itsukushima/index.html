<title>厳島神社を歩く</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* レイアウト: 全画面の3D。左上に題、右上に歩くボタン、下端に名所と環境(時刻・潮)、名所を選ぶと右に解説カード */
  :root{
    --sumi:#13161a;
    --glass:rgba(19,22,26,.66);
    --kinu:#efeadd;
    --kinu-dim:#bdbbb0;
    --shu:#e2532f;
    --line:rgba(239,234,221,.26);
    --font-disp:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
    --font-ui:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%}
  body{margin:0;background:var(--sumi);color:var(--kinu);font-family:var(--font-ui);font-size:14px;line-height:1.65;overflow:hidden}
  #stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--sumi)}
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
  #c.drag{cursor:grabbing}
  button{font:inherit;color:inherit}

  #top{position:absolute;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
  #top > *{pointer-events:auto}
  #top h1{margin:0;font-family:var(--font-disp);font-weight:700;font-size:26px;letter-spacing:.2em;line-height:1.2;text-shadow:0 0 3px rgba(10,12,14,.55),0 2px 18px rgba(10,12,14,.65)}
  #top h1 small{display:block;margin-top:4px;font-family:var(--font-ui);font-weight:400;font-size:12px;letter-spacing:.16em;color:var(--kinu)}

  .chip{font-size:13px;letter-spacing:.1em;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);padding:8px 14px;border-radius:2px;cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:var(--kinu)}
  .chip[aria-pressed="true"]{background:var(--kinu);color:var(--sumi);border-color:var(--kinu)}
  .chip.go{background:var(--shu);border-color:var(--shu);color:#fff}
  .chip.go[aria-pressed="true"]{background:var(--kinu);color:var(--sumi);border-color:var(--kinu)}
  .chip:focus-visible,#tide:focus-visible,#wslide:focus-visible,#closeCard:focus-visible,.pin:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

  #bar{position:absolute;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px 16px;pointer-events:none}
  #bar > *{pointer-events:auto}
  .row{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
  #spots{max-width:100%}
  #env{display:flex;flex-direction:column;gap:8px;align-items:flex-end;padding:10px 12px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:2px}
  #env .chip{padding:5px 12px;border-color:transparent;background:transparent}
  #env .chip[aria-pressed="true"]{background:var(--kinu)}
  .tide span{white-space:nowrap}
  .tide{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em}
  #tide{width:130px;accent-color:var(--shu)}
  #tideNote{font-size:12px;color:var(--kinu-dim);letter-spacing:.06em;min-height:1.2em}

  #card{position:absolute;right:16px;top:calc(64px + env(safe-area-inset-top,0px));width:min(350px,calc(100% - 32px));box-sizing:border-box;max-height:calc(100% - 230px);overflow:auto;padding:18px 20px 20px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:2px}
  #card[hidden]{display:none}
  #card .kana{margin:0;font-size:12px;letter-spacing:.2em;color:var(--kinu-dim)}
  #card h2{margin:2px 0 10px;font-family:var(--font-disp);font-weight:700;font-size:24px;letter-spacing:.12em;text-wrap:balance}
  #card .lead{margin:0 0 12px}
  #card ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
  #card li{padding-left:14px;position:relative;color:var(--kinu-dim);font-size:13px}
  #card li::before{content:'';position:absolute;left:0;top:.7em;width:6px;height:1px;background:var(--shu)}
  #closeCard{position:absolute;top:8px;right:10px;background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--kinu-dim);padding:4px 8px}

  #walkbar{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(620px,calc(100% - 32px));box-sizing:border-box;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;padding:12px 14px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:2px}
  #walkbar[hidden]{display:none}
  #wcap{grid-column:1 / -1;margin:0;font-size:13px}
  #wcap b{font-family:var(--font-disp);font-size:16px;letter-spacing:.12em;margin-right:.6em}
  #wslide{width:100%;accent-color:var(--shu)}

  #pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .pin{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:4px;transform:translate(-9999px,-9999px);text-shadow:0 1px 8px rgba(0,0,0,.75)}
  .pin i{width:14px;height:14px;border-radius:50%;background:var(--shu);border:2px solid var(--kinu);box-shadow:0 0 0 4px rgba(226,83,47,.28);flex:none}
  .pin span{font-size:12px;letter-spacing:.1em;color:var(--kinu);white-space:nowrap}
  #note{position:absolute;left:16px;top:calc(76px + env(safe-area-inset-top,0px));margin:0;font-size:11px;color:var(--kinu);opacity:.75;letter-spacing:.06em;text-shadow:0 1px 8px rgba(0,0,0,.7);max-width:24em}
  #nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--kinu-dim)}

  @media (max-width:640px){
    #top h1{font-size:21px}
    #card{top:auto;bottom:calc(178px + env(safe-area-inset-bottom,0px));max-height:34%}
    #env{align-items:stretch;width:100%;box-sizing:border-box}
    #env .row{justify-content:space-between}
    #tide{width:100%}
    .tide{justify-content:space-between}
    #note{display:none}
    .chip{padding:7px 11px}
  }
</style>

<div id="stage">
  <canvas id="c" tabindex="0" aria-label="厳島神社の3D表示。ドラッグで見回せます。"></canvas>
  <div id="pins"></div>
  <div id="top">
    <h1>厳島神社<small>潮と時刻で変わる社殿を歩く</small></h1>
    <button class="chip go" id="walk" type="button" aria-pressed="false">参道を歩く</button>
  </div>
  <p id="note">形と縮尺は簡略化した想像図です。</p>
  <aside id="card" hidden aria-live="polite">
    <button id="closeCard" type="button" aria-label="閉じる">×</button>
    <p class="kana" id="cKana"></p>
    <h2 id="cTitle"></h2>
    <p class="lead" id="cLead"></p>
    <ul id="cFacts"></ul>
  </aside>
  <div id="walkbar" hidden>
    <button class="chip" id="wplay" type="button">一時停止</button>
    <input id="wslide" type="range" min="0" max="1000" value="0" aria-label="参道の位置">
    <p id="wcap"></p>
  </div>
  <div id="bar">
    <div class="row" id="spots" role="group" aria-label="名所"></div>
    <div id="env">
      <div class="row" id="tods" role="group" aria-label="時刻">
        <button class="chip" type="button" data-tod="morning" aria-pressed="false">朝</button>
        <button class="chip" type="button" data-tod="noon" aria-pressed="false">昼</button>
        <button class="chip" type="button" data-tod="evening" aria-pressed="true">夕</button>
        <button class="chip" type="button" data-tod="night" aria-pressed="false">夜</button>
      </div>
      <div class="tide"><span>干潮</span><input id="tide" type="range" min="0" max="100" value="82" aria-label="潮位"><span>満潮</span><button class="chip" id="tideAuto" type="button" aria-pressed="false">自動</button></div>
      <div id="tideNote"></div>
    </div>
  </div>
  <div id="nogl">この環境では WebGL が使えないため、表示できません。</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const T = THREE;
const $ = s => document.querySelector(s);

/* ================= ユーティリティ ================= */
let seed = 1168;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const C = h => new T.Color(h).convertSRGBToLinear();
const hash2 = (x, y) => { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}
const fbm = (x, y) => vnoise(x, y) * 0.5 + vnoise(x * 2.1, y * 2.1) * 0.25 + vnoise(x * 4.3, y * 4.3) * 0.125 + vnoise(x * 8.7, y * 8.7) * 0.0625;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const angLerp = (a, b, t) => { const d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return a + d * t; };

/* ================= レンダラー ================= */
const canvas = $('#c');
let renderer;
try{
  renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
}catch(e){
  $('#nogl').style.display = 'flex'; return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
scene.fog = new T.FogExp2(0xffffff, 0.001);
const camera = new T.PerspectiveCamera(60, 1, 0.1, 3500);
const timeU = { value: 0 };

const hemi = new T.HemisphereLight(0xffffff, 0x888888, 0.8); scene.add(hemi);
const sun = new T.DirectionalLight(0xffffff, 2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -85, right: 85, top: 85, bottom: -85, near: 5, far: 500 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
sun.target.position.set(0, 0, -4); scene.add(sun, sun.target);

/* ================= 時刻のプリセット ================= */
const PRE = {
  morning: { sun: [0.8, 0.26, -0.35], sunCol: '#ffd6a0', sunI: 2.1, hemiSky: '#a9c4e0', hemiGnd: '#7d7a66', hemiI: 0.8, skyTop: '#6d9ad0', skyMid: '#b9d0e2', skyHor: '#f4dcc2', fog: '#cfd9dc', fogD: 0.0009, expo: 1.0, lamp: 0.12, star: 0, light: 0.95, sunSize: 1 },
  noon:    { sun: [0.2, 0.92, 0.3], sunCol: '#fff3dc', sunI: 2.7, hemiSky: '#b8d4ee', hemiGnd: '#8b8a70', hemiI: 0.95, skyTop: '#4a8ed8', skyMid: '#9cc6ea', skyHor: '#e0ebf1', fog: '#d6e3ea', fogD: 0.0007, expo: 0.95, lamp: 0, star: 0, light: 1.1, sunSize: 1 },
  evening: { sun: [-0.3, 0.14, 1.0], sunCol: '#ff9c58', sunI: 2.3, hemiSky: '#c99f92', hemiGnd: '#6d5b55', hemiI: 0.7, skyTop: '#4d5d99', skyMid: '#e2926f', skyHor: '#ffc684', fog: '#dcaa8c', fogD: 0.0011, expo: 1.05, lamp: 0.75, star: 0, light: 0.7, sunSize: 1.6 },
  night:   { sun: [-0.3, 0.5, 0.6], sunCol: '#a7bcff', sunI: 0.55, hemiSky: '#27386b', hemiGnd: '#10131f', hemiI: 0.5, skyTop: '#040816', skyMid: '#0c1838', skyHor: '#1b2b52', fog: '#0e1830', fogD: 0.0009, expo: 1.2, lamp: 1, star: 1, light: 0.22, sunSize: 0.5 }
};
function makePreset(p){
  return { sun: new T.Vector3(...p.sun).normalize(), sunCol: C(p.sunCol), hemiSky: C(p.hemiSky), hemiGnd: C(p.hemiGnd), skyTop: C(p.skyTop), skyMid: C(p.skyMid), skyHor: C(p.skyHor), fog: C(p.fog),
    sunI: p.sunI, hemiI: p.hemiI, fogD: p.fogD, expo: p.expo, lamp: p.lamp, star: p.star, light: p.light, sunSize: p.sunSize };
}
const PR = {}; Object.keys(PRE).forEach(k => PR[k] = makePreset(PRE[k]));
const cur = makePreset(PRE.evening);
const NUMS = ['sunI', 'hemiI', 'fogD', 'expo', 'lamp', 'star', 'light', 'sunSize'], COLS = ['sunCol', 'hemiSky', 'hemiGnd', 'skyTop', 'skyMid', 'skyHor', 'fog'];
let todFrom = null, todTo = null, todT = 1;
const lampMat = new T.MeshStandardMaterial({ color: C('#f4d8a0'), emissive: C('#ffb04a'), emissiveIntensity: 0.5, roughness: 0.8 });
const glowMat = new T.PointsMaterial({ size: 2.6, transparent: true, opacity: 0, depthWrite: false, blending: T.AdditiveBlending, color: C('#ffb860') });
const toriiGlow = { v: 0 };
const shared = { mats: [] };
function applyTod(){
  sun.position.copy(cur.sun).multiplyScalar(260).add(sun.target.position);
  sun.color.copy(cur.sunCol); sun.intensity = cur.sunI;
  hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGnd); hemi.intensity = cur.hemiI;
  scene.fog.color.copy(cur.fog); scene.fog.density = cur.fogD; renderer.toneMappingExposure = cur.expo;
  lampMat.emissiveIntensity = 0.35 + cur.lamp * 2.4; glowMat.opacity = cur.lamp * 0.8; toriiGlow.v = cur.lamp;
  shared.mats.forEach(m => { m.emissiveIntensity = cur.lamp * 0.3; });
}
function setTod(k){
  todFrom = { ...Object.fromEntries(NUMS.map(n => [n, cur[n]])), ...Object.fromEntries(COLS.map(c => [c, cur[c].clone()])), sun: cur.sun.clone() };
  todTo = PR[k]; todT = 0;
  document.querySelectorAll('#tods .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tod === k)));
}
function updateTod(dt){
  if(todT >= 1) return;
  todT = Math.min(1, todT + dt / 2.4); const k = ease(todT);
  NUMS.forEach(n => cur[n] = lerp(todFrom[n], todTo[n], k));
  COLS.forEach(c => cur[c].copy(todFrom[c]).lerp(todTo[c], k));
  cur.sun.copy(todFrom.sun).lerp(todTo.sun, k).normalize();
  applyTod();
}

/* ================= テクスチャ ================= */
function tex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.wrapS = t.wrapT = T.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); return t;
}
function dots(g, w, h, n, cols, r0, r1, a){
  for(let i = 0; i < n; i++){
    g.globalAlpha = a * (0.5 + rnd() * 0.5); g.fillStyle = cols[(rnd() * cols.length) | 0];
    g.beginPath(); g.arc(rnd() * w, rnd() * h, rr(r0, r1), 0, 6.2832); g.fill();
  }
  g.globalAlpha = 1;
}
const floorTex = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#b89062'; g.fillRect(0, 0, w, h);
  const rows = 10, rh = h / rows;
  for(let r = 0; r < rows; r++){
    g.fillStyle = `rgba(${rnd() * 50},${rnd() * 30},0,${0.06 + rnd() * 0.12})`; g.fillRect(0, r * rh, w, rh);
    for(let i = 0; i < 18; i++){
      g.strokeStyle = `rgba(${80 + rnd() * 30},${52 + rnd() * 20},${26 + rnd() * 12},${0.1 + rnd() * 0.25})`; g.lineWidth = rr(0.6, 1.6);
      const y = r * rh + rr(3, rh - 3); g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + rr(-2, 2)); g.stroke();
    }
    g.fillStyle = '#3d2a1c'; g.fillRect(0, r * rh, w, 3);
  }
});
const barkTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#62503f'; g.fillRect(0, 0, w, h);
  for(let i = 0; i < 160; i++){
    g.strokeStyle = `rgba(${30 + rnd() * 50},${25 + rnd() * 40},${18 + rnd() * 30},${0.2 + rnd() * 0.4})`; g.lineWidth = rr(0.8, 2.6);
    const y = rnd() * h; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + rr(-3, 3)); g.stroke();
  }
  dots(g, w, h, 1500, ['#7d6a56', '#4a3c30'], 0.6, 1.6, 0.3);
});
const plasterTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#e8e1ce'; g.fillRect(0, 0, w, h); dots(g, w, h, 1800, ['#cfc7b0', '#f5f1e4'], 0.6, 2, 0.3);
});
const woodTex = tex(128, 256, (g, w, h) => {
  g.fillStyle = '#7d5a3c'; g.fillRect(0, 0, w, h);
  for(let i = 0; i < 50; i++){ g.strokeStyle = `rgba(40,25,12,${0.1 + rnd() * 0.25})`; g.lineWidth = rr(0.6, 2); const x = rnd() * w; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + rr(-4, 4), h); g.stroke(); }
});
const detailTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#b8b8b8'; g.fillRect(0, 0, w, h);
  dots(g, w, h, 5000, ['#8a8a8a', '#d8d8d8', '#a0a0a0'], 0.7, 2.6, 0.5);
  for(let i = 0; i < 40; i++){ g.strokeStyle = 'rgba(90,90,90,0.15)'; g.lineWidth = 2; const y = rnd() * h; g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * 0.3, y + rr(-8, 8), w * 0.6, y + rr(-8, 8), w, y); g.stroke(); }
});
const pineTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#2f3a2c'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#d6c88a'; g.lineCap = 'round'; g.lineWidth = 7;
  g.beginPath(); g.moveTo(128, 250); g.bezierCurveTo(100, 180, 160, 130, 118, 60); g.stroke();
  g.lineWidth = 3;
  for(let i = 0; i < 9; i++){ const y = 60 + i * 18, x = 120 + Math.sin(i) * 12; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 30, y - 12, x + 52, y + 4); g.moveTo(x, y); g.quadraticCurveTo(x - 30, y - 10, x - 50, y + 6); g.stroke(); }
});
const plaqueTex = tex(128, 256, (g, w, h) => {
  g.fillStyle = '#1d3a4a'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#c9a14a'; g.lineWidth = 5; g.strokeRect(6, 6, w - 12, h - 12);
  g.fillStyle = '#e4c265'; g.font = '700 46px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif'; g.textAlign = 'center';
  '厳島神社'.split('').forEach((ch, i) => g.fillText(ch, w / 2, 62 + i * 52));
});
const glowSprite = tex(64, 64, (g, w, h) => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,230,170,1)'); gr.addColorStop(0.3, 'rgba(255,190,110,0.45)'); gr.addColorStop(1, 'rgba(255,170,90,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
glowMat.map = glowSprite;

/* ================= マテリアル ================= */
const std = o => new T.MeshStandardMaterial(o);
const M = {
  shu: std({ color: C('#d83f1f'), roughness: 0.55, emissive: C('#d83f1f'), emissiveIntensity: 0 }),
  shuDark: std({ color: C('#a83018'), roughness: 0.7 }),
  floor: std({ map: floorTex, roughness: 0.75 }),
  floorHi: std({ map: floorTex, color: C('#d8c4a8'), roughness: 0.7 }),
  bark: std({ map: barkTex, roughness: 1, side: T.DoubleSide }),
  plaster: std({ map: plasterTex, roughness: 1 }),
  wood: std({ map: woodTex, roughness: 0.85 }),
  dwood: std({ map: woodTex, color: C('#6b5444'), roughness: 0.9 }),
  soffit: std({ map: woodTex, color: C('#b58c66'), roughness: 0.9, emissive: C('#6a4a30'), emissiveIntensity: 0.35 }),
  black: std({ color: C('#1d1a18'), roughness: 0.35 }),
  barn: std({ color: C('#5b4a3c'), roughness: 1 }),
  gold: std({ color: C('#d4af55'), roughness: 0.4, metalness: 0.5 }),

function curvedBeam(len, h, d, amp, mat, capMat, y, parent){

    const x0 = -len / 2 + i * len / n, x1 = x0 + len / n, y0 = f(x0), y1 = f(x1);
    const seg = new T.Mesh(new T.BoxGeometry(len / n * 1.04, h, d), mat);
    seg.position.set((x0 + x1) / 2, y + (y0 + y1) / 2, 0); seg.rotation.z = Math.atan2(y1 - y0, x1 - x0); parent.add(seg);
    if(capMat){ const cap = new T.Mesh(new T.BoxGeometry(len / n * 1.04, 0.22, d * 1.04), capMat); cap.position.y = h / 2 + 0.11; seg.add(cap); }
  }
}

    const w = canvas.clientWidth, h = canvas.clientHeight; camera.updateMatrixWorld();
    Object.values(pinEls).forEach(p => {
      tmp.copy(p.v).project(camera);
      const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.05 && Math.abs(tmp.y) < 1.05;
      p.el.style.transform = vis ? `translate(${(tmp.x * 0.5 + 0.5) * w - 14}px,${(-tmp.y * 0.5 + 0.5) * h - 14}px)` : 'translate(-9999px,-9999px)';
    });
  }
  renderer.render(scene, camera);
}
frame();
window.__it = { cam, SPOTS, selectSpot, setTod, setTide, startWalk, walk, snap: id => { const s = SPOTS.find(x => x.id === id).view; cam.p.set(...s.p); cam.yaw = s.yaw; cam.pitch = s.pitch; cam.fov = s.fov; tween = null; } };
})();
